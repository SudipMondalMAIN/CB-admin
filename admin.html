    const squadSize = document.getElementById('mf-squad_size').value;
    if(squadSize!=='') body.squad_size = Number(squadSize);
    const bannerUrl = document.getElementById('mf-banner_url').value;
    if(bannerUrl!=='') body.banner_url = bannerUrl;
    const coverUrl = document.getElementById('mf-cover_url').value;
    if(coverUrl!=='') body.cover_url = coverUrl;
    const isActive = document.getElementById('mf-is_active').value;
    body.is_active = isActive === 'true';
    const first_time = document.getElementById('mf-first_time').value;
    const last_time = document.getElementById('mf-last_time').value;
    const interval = Number(document.getElementById('mf-interval').value);
    if(first_time && last_time){ body.daily_slot_times = generateSlotTimes(first_time, last_time, interval); }
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const r = await apiCall('PATCH', `/schedules/${encodeURIComponent(id)}`, {body});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — record updated.</div>`;
      setTimeout(()=>{ closeModal(); refreshAllPanes(); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  };
}

function openActionModal(modKey, idx){
  const mod = MODULES.find(m=>m.key===modKey);
  const a = mod.actions[idx];
  if(a.custom){ window[a.custom](); return; }
  buildModal(a.label, `${mod.label}`, a.fields, async ()=>{
    const {out, missing} = collectFields(a.fields);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    let path = a.path;
    const bodyOut = Object.assign({}, out);
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const uidErr = await resolveUidFields(a.fields, out, bodyOut);
    if(uidErr){
      document.getElementById('modalSubmitBtn').disabled = false;
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${uidErr}</div>`;
      return;
    }
    a.fields.forEach(f=>{ if(path.includes(':'+f.name)){ path = path.replace(':'+f.name, encodeURIComponent(out[f.name]||'')); delete bodyOut[f.name]; } });
    // queryFields: field names that must go on the querystring even for
    // non-GET requests (some endpoints, e.g. prize-pool cancel, take a
    // reason as a query param rather than a JSON body).
    const queryOut = {};
    (a.queryFields||[]).forEach(name=>{ if(name in bodyOut){ queryOut[name] = bodyOut[name]; delete bodyOut[name]; } });
    const r = await apiCall(a.method, path, {body: (a.method==='GET'?null:bodyOut), query:(a.method==='GET'?bodyOut:queryOut)});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — request completed successfully.</div>`;
      if(a.resultAsCard){ renderResultCard(r.data); }
      else if(a.resultAsTable){ renderResultTable(r.data, a.columns); }
      else { setTimeout(()=>{ closeModal(); refreshAllPanes(); }, 900); }
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  }, 'Confirm');
  populateGameSelects(a.fields);
}

function openRowActionModal(modKey, listKey, raIdx, id){
  const mod = MODULES.find(m=>m.key===modKey);
  let ra;
  if(listKey==='main'){
    ra = mod.rowActions[raIdx];
  } else {
    const extraIdx = Number(listKey.replace('extra',''));
    ra = mod.extraLists[extraIdx].rowActions[raIdx];
  }
  if(ra.custom){ window[ra.custom](id); return; }
  const fields = ra.body || [];
  buildModal(ra.label, `Applies to record #${id}.`, fields, async ()=>{
    const {out, missing} = collectFields(fields);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    const path = ra.path.replace(':id', encodeURIComponent(id));
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const r = await apiCall(ra.method, path, {body: (ra.method==='GET'?null:out)});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — record updated.</div>`;
      setTimeout(()=>{ closeModal(); removeRowById(id); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  }, 'Confirm');
  populateGameSelects(fields);
}

function renderResultCard(data){
  const d = data.data || data;
  const entries = Object.entries(d).filter(([k,v])=>typeof v!=='object');
  document.getElementById('modalResult').innerHTML = `
    <div class="hint" style="margin-top:14px;font-weight:700;">Result</div>
    <dl class="kvGrid" style="margin-top:10px;">
      ${entries.map(([k,v])=>`<dt>${k}</dt><dd>${v==null?'—':String(v)}</dd>`).join('')}
    </dl>`;
}
function renderResultTable(data, columns){
  const items = extractItems(data);
  if(!items.length){ document.getElementById('modalResult').innerHTML = `<div class="empty">No records found.</div>`; return; }
  let html = `<div class="tableWrap" style="margin-top:14px;"><table class="dataTable"><thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>`;
  items.forEach(row=>{
    html += '<tr>' + columns.map(c=>{
      let v = row[c.key];
      if(v==null) return '<td class="cellMuted">—</td>';
      return `<td>${c.fmt ? c.fmt(v, row) : String(v)}</td>`;
    }).join('') + '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('modalResult').innerHTML = html;
}

/* ============================================================
   SUPPORT CHAT — live queue (lobby socket) + per-session chat
   (agent socket). REST endpoints (/support/*, /admin/support/*)
   provide initial page-load state; the WebSockets keep everything
   live after that.
============================================================ */
const Support = {
  lobbySocket: null,
  sessionSocket: null,
  activeSessionId: null,
  waiting: [],       // sessions currently in the queue (any status, for the left list)
  allSessions: {},    // id -> session object, merged from lobby pushes
};

function wsBase(){
  // API_BASE looks like https://host/api/v1 -> wss://host/api/v1
  return API_BASE.replace(/^http/i, 'ws');
}

function teardownSupport(){
  if(Support.lobbySocket){ try{ Support.lobbySocket.close(); }catch(e){} Support.lobbySocket = null; }
  if(Support.sessionSocket){ try{ Support.sessionSocket.close(); }catch(e){} Support.sessionSocket = null; }
  Support.activeSessionId = null;
}

async function renderSupport(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div id="supportWrap">
      <div id="supportQueue">
        <div class="glass">
          <div class="sectionHead" style="margin-bottom:8px;"><div><h3 style="font-size:15px;">Chats</h3></div></div>
          <div id="supportQueueList"><div class="hint">Connecting…</div></div>
        </div>
      </div>
      <div id="supportChatPane" class="glass">
        <div id="supportEmpty">
          <div style="font-size:32px;">💬</div>
          <div>Select a chat from the list to join or view it</div>
        </div>
      </div>
    </div>
  `;
  connectSupportLobby();
}

function connectSupportLobby(){
  if(Support.lobbySocket) return;
  const url = `${wsBase()}/ws/support/admin/lobby?token=${encodeURIComponent(State.accessToken)}`;
  let sock;
  try{ sock = new WebSocket(url); }catch(e){ renderQueueError(); return; }
  Support.lobbySocket = sock;

  sock.onmessage = (ev)=>{
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type==='init'){
      (msg.waiting||[]).forEach(s=>{ Support.allSessions[s.id] = s; });
      renderQueueList();
    } else if(msg.type==='session_update'){
      Support.allSessions[msg.session.id] = msg.session;
      renderQueueList();
    }
  };
  sock.onclose = ()=>{
    if(Support.lobbySocket===sock){ Support.lobbySocket = null; }
  };
  sock.onerror = ()=>{};
}

function renderQueueError(){
  const el = document.getElementById('supportQueueList');
  if(el) el.innerHTML = `<div class="banner err">Couldn't connect to the support queue.</div>`;
}

function renderQueueList(){
  const el = document.getElementById('supportQueueList');
  if(!el) return;
  const sessions = Object.values(Support.allSessions)
    .filter(s=>s.status!=='closed' || s.id===Support.activeSessionId)
    .sort((a,b)=> (a.status==='waiting'&&b.status!=='waiting') ? -1
                 : (b.status==='waiting'&&a.status!=='waiting') ? 1
                 : new Date(b.last_message_at||b.created_at) - new Date(a.last_message_at||a.created_at));
  if(!sessions.length){ el.innerHTML = `<div class="hint">No active chats right now.</div>`; return; }
  el.innerHTML = sessions.map(s=>`
    <div class="supportQueueItem ${s.id===Support.activeSessionId?'active':''}" onclick="openSupportSession('${s.id}')">
      <div class="sqTop">
        <span style="font-size:13px;">User ${s.user_id.slice(0,8)}</span>
        <span class="sqStatus ${s.status}">${s.status}</span>
      </div>
      <div class="hint" style="font-size:11px;">${s.last_message_at ? new Date(s.last_message_at).toLocaleTimeString() : 'No messages yet'}</div>
    </div>
  `).join('');
}

async function openSupportSession(sessionId){
  Support.activeSessionId = sessionId;
  renderQueueList();

  const pane = document.getElementById('supportChatPane');
  pane.innerHTML = `
    <div id="supportChatHeader">
      <div><b>Chat</b> <span class="hint" id="scStatusLbl"></span></div>
      <div>
        <button class="btn btn-primary btn-sm" id="scJoinBtn" onclick="joinSupportSession('${sessionId}')" style="display:none;">Join Chat</button>
        <button class="btn btn-danger btn-sm" id="scEndBtn" onclick="endSupportSession('${sessionId}')" style="display:none;">End Chat</button>
      </div>
    </div>
    <div id="supportMessages"><div class="hint" style="text-align:center;margin-top:20px;">Loading…</div></div>
    <div id="supportInputRow">
      <input type="text" id="scInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendSupportMessage('${sessionId}')"/>
      <button class="btn btn-primary btn-sm" onclick="sendSupportMessage('${sessionId}')">Send</button>
    </div>
  `;

  if(Support.sessionSocket){ try{ Support.sessionSocket.close(); }catch(e){} Support.sessionSocket = null; }

  const url = `${wsBase()}/ws/support/agent/${sessionId}?token=${encodeURIComponent(State.accessToken)}`;
  let sock;
  try{ sock = new WebSocket(url); }catch(e){ showToast('Could not open chat', 'err'); return; }
  Support.sessionSocket = sock;

  sock.onmessage = (ev)=>{
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type==='init'){
      renderSupportMessages(msg.messages||[]);
      updateSupportHeader(msg.session);
      Support.allSessions[msg.session.id] = msg.session;
      renderQueueList();
    } else if(msg.type==='message'){
      appendSupportMessage(msg.message);
    } else if(msg.type==='session_update'){
      updateSupportHeader(msg.session);
      Support.allSessions[msg.session.id] = msg.session;
      renderQueueList();
    } else if(msg.type==='error'){
      showToast(msg.detail || 'Chat error', 'err');
    }
  };
  sock.onclose = ()=>{
    if(Support.sessionSocket===sock) Support.sessionSocket = null;
  };
  sock.onerror = ()=>{};
}

function updateSupportHeader(session){
  const lbl = document.getElementById('scStatusLbl');
  const joinBtn = document.getElementById('scJoinBtn');
  const endBtn = document.getElementById('scEndBtn');
  const input = document.getElementById('scInput');
  if(!lbl) return;
  lbl.textContent = `· ${session.status}`;
  if(session.status==='waiting'){
    joinBtn.style.display='inline-block'; endBtn.style.display='none';
    if(input) input.disabled = true;
  } else if(session.status==='active'){
    joinBtn.style.display='none'; endBtn.style.display='inline-block';
    if(input) input.disabled = false;
  } else {
    joinBtn.style.display='none'; endBtn.style.display='none';
    if(input) input.disabled = true;
  }
}

function renderSupportMessages(messages){
  const el = document.getElementById('supportMessages');
  if(!el) return;
  el.innerHTML = messages.map(scMsgHtml).join('');
  el.scrollTop = el.scrollHeight;
}
function appendSupportMessage(m){
  const el = document.getElementById('supportMessages');
  if(!el) return;
  el.insertAdjacentHTML('beforeend', scMsgHtml(m));
  el.scrollTop = el.scrollHeight;
}
function scMsgHtml(m){
  const cls = m.sender_type==='agent' ? 'agent' : m.sender_type==='system' ? 'system' : 'user';
  const time = new Date(m.created_at).toLocaleTimeString();
  return `<div class="scMsg ${cls}">${escapeHtml(m.content)}<div class="scTime">${time}</div></div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function sendSupportMessage(sessionId){
  const input = document.getElementById('scInput');
  const content = input.value.trim();
  if(!content || !Support.sessionSocket || Support.sessionSocket.readyState!==WebSocket.OPEN) return;
  Support.sessionSocket.send(JSON.stringify({type:'message', content}));
  input.value = '';
}

function joinSupportSession(sessionId){
  // Joining happens implicitly by the agent socket connecting, but if
  // the session was still 'waiting' when we opened it, send an explicit
  // nudge isn't needed — the backend marks it active on socket connect.
  // This button mainly exists for clarity; re-affirm via REST as a
  // fallback in case the socket already connected before status synced.
  apiCall('POST', `/admin/support/sessions/${sessionId}/join`);
}

async function endSupportSession(sessionId){
  if(Support.sessionSocket && Support.sessionSocket.readyState===WebSocket.OPEN){
    Support.sessionSocket.send(JSON.stringify({type:'end'}));
  } else {
    await apiCall('POST', `/admin/support/sessions/${sessionId}/end`);
  }
}

/* ============================================================
   BOOTSTRAP — must run after MODULES/buildNav/goSection are all
   defined above, otherwise a page load with a stored token throws
   "Cannot access 'MODULES' before initialization" and the whole
   script dies before the sidebar ever renders.
============================================================ */
if(State.accessToken){
  // Don't trust a cached token/role blindly on reload — re-verify with the
  // server that this session still belongs to an admin before entering.
  verifyAdminSession().then(function(ok){ if(ok) enterApp(); });
}
</script>
