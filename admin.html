<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassyBattle — Admin</title>
<style>
:root{
  --bg1:#f4f6f9; --bg2:#e9edf3;
  --glass:rgba(255,255,255,0.55); --glass-strong:rgba(255,255,255,0.75);
  --border:rgba(255,255,255,0.6); --border-soft:rgba(20,20,30,0.08);
  --text:#14161a; --sub:#6a7180; --sub2:#9aa1ae;
  --accent:#2f6fed; --accent2:#00c896; --danger:#e5484d; --warn:#e29a1c;
  --shadow:0 8px 32px rgba(31,41,55,0.10), 0 2px 8px rgba(31,41,55,0.06);
  --shadow-lg:0 20px 60px rgba(31,41,55,0.16), 0 4px 16px rgba(31,41,55,0.08);
  --radius:18px; --radius-sm:12px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;color:var(--text);font-family:var(--sans);font-size:14px;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(47,111,237,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(0,200,150,0.08), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  min-height:100vh;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(20,20,30,0.15);border-radius:5px;}

.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:var(--radius);
}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;}
#loadingScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px;}
#loadingScreen .spinner{width:28px;height:28px;border-width:3px;}
#loadingScreen .loadingText{color:var(--sub);font-size:13px;font-weight:600;}
.loginCard{width:400px;padding:38px 36px;text-align:center;}
.loginCard .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;
  box-shadow:0 10px 30px rgba(47,111,237,0.35);}
.loginCard h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px;}
.loginCard p.sub{color:var(--sub);margin:6px 0 26px;font-size:13px;}
.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:rgba(255,255,255,0.7);border:1px solid var(--border-soft);color:var(--text);
  padding:12px 14px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:14px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,111,237,0.12);}
/* plain number box, no browser +/- stepper */
.field input[type="number"]{-moz-appearance:textfield;}
.field input[type="number"]::-webkit-outer-spin-button,
.field input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.searchInput{
  background:rgba(255,255,255,0.7);border:1px solid var(--border-soft);color:var(--text);
  padding:12px 14px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:14px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,111,237,0.12);}
.btn{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-weight:600;font-size:13.5px;font-family:var(--sans);transition:filter .15s, transform .05s, box-shadow .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#1c56d6);color:#fff;width:100%;box-shadow:0 8px 20px rgba(47,111,237,0.30);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:rgba(255,255,255,0.6);border:1px solid var(--border-soft);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:rgba(229,72,77,0.10);border:1px solid rgba(229,72,77,0.25);color:var(--danger);}
.btn-danger:hover{background:rgba(229,72,77,0.16);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px;}
.loginErr{color:var(--danger);font-size:12.5px;margin-top:12px;min-height:16px;}

/* ---------- SHELL ---------- */
#app{display:none;height:100vh;padding:14px;gap:14px;}
#app.active{display:flex;}
#sidebar{width:236px;flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:10px;}
#sidebar .brand .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0;}
#sidebar .brand b{font-size:14px;letter-spacing:-.2px;}
#sidebar .brand span{display:block;font-size:10.5px;color:var(--sub2);}
#navList{flex:1;overflow-y:auto;}
.navGroupLabel{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--sub2);padding:14px 10px 6px;font-weight:700;}
.navItem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer;color:var(--sub);font-size:13.5px;margin-bottom:2px;font-weight:500;transition:background .12s,color .12s;}
.navItem:hover{background:rgba(47,111,237,0.08);color:var(--text);}
.navItem.active{background:linear-gradient(135deg,rgba(47,111,237,0.14),rgba(0,200,150,0.10));color:var(--accent);font-weight:700;}
.navItem .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0;}
#sidebar .foot{padding-top:12px;border-top:1px solid var(--border-soft);}
#sidebar .foot .who{font-size:12.5px;font-weight:600;margin-bottom:10px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;gap:14px;}
#topbar{height:58px;flex-shrink:0;display:flex;align-items:center;padding:0 22px;justify-content:space-between;}
#topbar h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px;}
#topbar .sub{font-size:12px;color:var(--sub);margin-top:1px;}
#content{flex:1;overflow-y:auto;padding-right:2px;}
#content > .pane{padding:22px;margin-bottom:16px;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.statCard{padding:20px;}
.statCard .lbl{color:var(--sub);font-size:12px;font-weight:600;}
.statCard .val{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.5px;}
.statCard .val.accent{color:var(--accent);}
.statCard .val.warn{color:var(--warn);}
.statCard .val.danger{color:var(--danger);}
.statCard .val.ok{color:var(--accent2);}

.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.sectionHead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px;}
.sectionHead .desc{color:var(--sub);font-size:12.5px;margin-top:3px;}

.actionsBar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;}
.formGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:6px;}
.hint{font-size:12px;color:var(--sub2);margin-top:5px;}

/* tables */
.tableWrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border-soft);}
table.dataTable{width:100%;border-collapse:collapse;font-size:13px;}
table.dataTable thead th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);background:rgba(255,255,255,0.55);border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.dataTable tbody td{padding:12px 14px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:top;}
table.dataTable tbody tr:hover{background:rgba(47,111,237,0.04);}
table.dataTable tbody tr:last-child td{border-bottom:none;}
.cellMuted{color:var(--sub2);}
.upiQrThumb{width:52px;height:52px;border-radius:6px;border:1px solid var(--border,#333);background:#fff;padding:3px;cursor:pointer;transition:transform .15s ease;object-fit:contain;}
.upiQrThumb:hover{transform:scale(1.15);}
.tblToolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.pager{display:flex;gap:8px;align-items:center;margin-top:14px;justify-content:flex-end;}
.pager span{font-size:12.5px;color:var(--sub);}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.ok{background:rgba(0,200,150,0.14);color:#00805f;}
.badge.warn{background:rgba(226,154,28,0.15);color:#a56a00;}
.badge.danger{background:rgba(229,72,77,0.13);color:var(--danger);}
.badge.info{background:rgba(47,111,237,0.12);color:var(--accent);}
.badge.gray{background:rgba(20,20,30,0.07);color:var(--sub);}

.empty{color:var(--sub2);font-size:13px;text-align:center;padding:40px 0;}
.loadingRow{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;padding:30px 0;justify-content:center;}
.spinner{width:15px;height:15px;border:2px solid rgba(47,111,237,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.banner{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.banner.ok{background:rgba(0,200,150,0.10);color:#00805f;border:1px solid rgba(0,200,150,0.25);}
.banner.err{background:rgba(229,72,77,0.10);color:var(--danger);border:1px solid rgba(229,72,77,0.25);}

/* modal */
#modalOverlay{position:fixed;inset:0;background:rgba(20,25,35,0.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
#modalOverlay.active{display:flex;}
.modalCard{width:520px;max-width:100%;max-height:85vh;overflow-y:auto;padding:26px;}
.modalCard.wide{width:920px;}
.profileTabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--border-soft);margin-bottom:16px;padding-bottom:10px;scrollbar-width:thin;}
.profileTabs button{border:none;background:transparent;color:var(--sub);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s;}
.profileTabs button:hover{background:rgba(255,255,255,0.06);}
.profileTabs button.active{background:var(--accent);color:#fff;}
.profileTopRow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.profileAvatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2,#2ecc71));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex:none;}
.profileIdent{display:flex;gap:14px;align-items:center;}
.profileIdent .pname{font-size:17px;font-weight:800;line-height:1.3;}
.profileIdent .pmeta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.profileStats{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
.pStatCard{flex:1 1 0;min-width:108px;border:1px solid var(--border-soft);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,0.02);white-space:nowrap;}
.pStatCard .lbl{font-size:10.5px;color:var(--sub2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.pStatCard .val{font-size:16px;font-weight:800;margin-top:5px;white-space:nowrap;}
.profileActionsBar{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);}
.profileActionsBar .btn{flex:none;white-space:nowrap;width:auto;}
.profilePane{min-height:120px;}
.profilePane .tableWrap{max-height:360px;overflow-y:auto;}
.pillNote{font-size:11px;color:var(--sub2);}
.miniActions{display:flex;gap:6px;flex-wrap:wrap;}
.miniActions button{font-size:11px;padding:5px 9px;border-radius:8px;}

/* ---- Toasts ---- */
#toastContainer{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:360px;}
.toast{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border-radius:12px;background:rgba(24,28,38,0.96);border:1px solid var(--border-soft);box-shadow:0 8px 24px rgba(0,0,0,0.35);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:600;line-height:1.4;transform:translateX(120%);opacity:0;transition:transform .28s ease,opacity .28s ease;}
.toast.show{transform:translateX(0);opacity:1;}
.toast.hide{transform:translateX(120%);opacity:0;}
.toast .ticon{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
.toast.ok .ticon{background:rgba(46,204,113,0.18);color:#2ecc71;}
.toast.err .ticon{background:rgba(231,76,60,0.18);color:#e74c3c;}
.toast.info .ticon{background:rgba(47,111,237,0.18);color:#2f6fed;}
.toast .tbody{flex:1;}
.toast .tclose{flex:none;cursor:pointer;color:var(--sub2);font-size:13px;opacity:.7;}
.toast .tclose:hover{opacity:1;}

/* ---- Styled prompt (replaces window.prompt) ---- */
#promptOverlay{position:fixed;inset:0;background:rgba(20,25,35,0.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;}
#promptOverlay.active{display:flex;}
#promptCard{padding:22px;}
#promptCard h3{margin:0 0 4px;font-size:15px;font-weight:800;}
#promptCard .pdesc{font-size:12.5px;color:var(--sub);margin-bottom:14px;}
#promptCard .field{margin-bottom:12px;}
#promptCard .perr{font-size:12px;color:#e74c3c;font-weight:600;margin-top:8px;min-height:16px;}
.modalCard .mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.modalCard h3{margin:0;font-size:16px;font-weight:800;}
.modalCard .mdesc{font-size:12.5px;color:var(--sub);margin-top:4px;}
.closeX{cursor:pointer;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:16px;background:rgba(20,20,30,0.05);flex-shrink:0;}
.closeX:hover{background:rgba(229,72,77,0.10);color:var(--danger);}

.rowActions{display:flex;gap:6px;flex-wrap:wrap;}
.kvGrid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;}
.kvGrid dt{color:var(--sub);font-weight:600;}
.kvGrid dd{margin:0;}
/* ===== Support Chat ===== */
#supportWrap{display:flex; gap:16px; height:calc(100vh - 170px); min-height:420px;}
#supportQueue{width:300px; flex-shrink:0; overflow-y:auto;}
#supportQueue .glass{padding:10px;}
.supportQueueItem{padding:10px 12px; border-radius:10px; cursor:pointer; margin-bottom:8px; transition:background .15s;}
.supportQueueItem:hover{background:rgba(255,255,255,0.06);}
.supportQueueItem.active{background:rgba(99,102,241,0.18); border:1px solid rgba(99,102,241,0.4);}
.supportQueueItem .sqTop{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.supportQueueItem .sqStatus{font-size:11px; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
.sqStatus.waiting{background:rgba(245,158,11,0.2); color:#f59e0b;}
.sqStatus.active{background:rgba(34,197,94,0.2); color:#22c55e;}
.sqStatus.closed{background:rgba(148,163,184,0.2); color:#94a3b8;}
#supportChatPane{flex:1; display:flex; flex-direction:column; min-width:0;}
#supportChatHeader{display:flex; justify-content:space-between; align-items:center; padding:12px 16px;}
#supportMessages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.scMsg{max-width:70%; padding:8px 12px; border-radius:12px; font-size:14px; line-height:1.4; word-wrap:break-word;}
.scMsg.user{align-self:flex-start; background:rgba(255,255,255,0.08);}
.scMsg.agent{align-self:flex-end; background:rgba(99,102,241,0.35);}
.scMsg.system{align-self:center; background:transparent; color:var(--muted,#94a3b8); font-size:12px; font-style:italic;}
.scMsg .scTime{font-size:10px; opacity:.6; margin-top:3px;}
#supportInputRow{display:flex; gap:8px; padding:12px 16px; border-top:1px solid rgba(255,255,255,0.08);}
#supportInputRow input{flex:1;}
#supportEmpty{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted,#94a3b8); flex-direction:column; gap:8px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="loginCard glass">
    <div class="mark">CB</div>
    <h1>ClassyBattle</h1>
    <p class="sub">Sign in to the Admin Panel</p>
    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="text" placeholder="you@classybattle.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="doLogin()" id="loginBtn">Sign In</button>
    <div class="loginErr" id="loginErr"></div>
  </div>
</div>

<!-- ================= LOADING (shown instead of the login form while a
     stored session is being re-verified on page load/refresh, so a
     returning admin never sees a flash of the login box) ================= -->
<div id="loadingScreen">
  <span class="spinner"></span>
  <div class="loadingText">Loading Your Workspace…</div>
</div>

<!-- Runs before any other script, synchronously, so the correct screen
     is showing on the very first paint -- no flash of the login form
     for a session that's about to be auto-restored. -->
<script>
  if (localStorage.getItem('cb_access_token')) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'flex';
  }
</script>

<!-- ================= APP SHELL ================= -->
<div id="app">
  <div id="sidebar" class="glass">
    <div class="brand"><div class="mk">CB</div><div><b>ClassyBattle</b><span>Admin Panel</span></div></div>
    <div id="navList"></div>
    <div class="foot">
      <div class="who" id="whoami">—</div>
      <button class="btn btn-danger btn-sm" style="width:100%" onclick="doLogout()">Log out</button>
    </div>
  </div>
  <div id="main">
    <div id="topbar" class="glass">
      <div><h2 id="pageTitle">Dashboard</h2><div class="sub" id="pageSub">Overview of your platform</div></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modalCard glass" id="modalCard"></div>
</div>

<!-- ================= PROMPT (styled replacement for window.prompt) ================= -->
<div id="promptOverlay" onclick="if(event.target===this)closePrompt(null)">
  <div class="modalCard glass" id="promptCard" style="width:400px;"></div>
</div>

<!-- ================= TOASTS ================= -->
<div id="toastContainer"></div>

<script>
/* ============================================================
   CONFIG / STATE
============================================================ */
const API_BASE = 'https://classybattle.onrender.com/api/v1'; // fixed, not user-editable

const State = {
  accessToken: localStorage.getItem('cb_access_token') || '',
  refreshToken: localStorage.getItem('cb_refresh_token') || '',
  userEmail: localStorage.getItem('cb_user_email') || '',
  userRole: localStorage.getItem('cb_user_role') || '',
  section: 'dashboard',
};

/* ============================================================
   CORE API CALLER (internal only — never shown to the user)
============================================================ */
/* ============================================================

function playVoice(kind){
  try{
    const a = kind==='processing' ? VOICE_PROCESSING : VOICE_COMPLETED;
    a.currentTime = 0;
    a.play().catch(()=>{});
  }catch(e){}
}

// Plays the "processing" voice and returns a promise that resolves only
// once it has FULLY finished playing (or 6s fallback if it can't load),
// so the "completed" voice never cuts it off / overlaps it.
function playProcessingAndWait(){
  return new Promise((resolve)=>{
    try{
      const a = VOICE_PROCESSING;
      a.currentTime = 0;
      let done = false;
      const finish = ()=>{ if(done) return; done = true; a.removeEventListener('ended', finish); resolve(); };
      a.addEventListener('ended', finish);
      a.play().catch(()=>{ finish(); });
      setTimeout(finish, 6000); // safety fallback
    }catch(e){ resolve(); }
  });
}


async function apiCall(method, path, {query={}, body=null, auth=true} = {}){
  let url = API_BASE + path;
  const qs = Object.entries(query).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  if(qs) url += (url.includes('?')?'&':'?') + qs;

  const headers = {'Content-Type':'application/json'};
  if(auth && State.accessToken) headers['Authorization'] = 'Bearer ' + State.accessToken;

  const opts = {method, headers};
  if(body!=null && method!=='GET') opts.body = JSON.stringify(body);

  let res, data, text;
  try{
    res = await fetch(url, opts);
    text = await res.text();
    try{ data = text ? JSON.parse(text) : {}; }catch(e){ data = {raw:text}; }
  }catch(networkErr){
    return {ok:false, status:0, data:{message:'Could not reach the server. Check your connection.'}};
  }

  if(res.status===401 && State.refreshToken && auth && !path.includes('/auth/')){
    const refreshed = await tryRefresh();
    if(refreshed){
      headers['Authorization'] = 'Bearer ' + State.accessToken;
      res = await fetch(url, opts);
      text = await res.text();
      try{ data = text ? JSON.parse(text) : {}; }catch(e){ data = {raw:text}; }
    }
  }
  return {ok:res.ok, status:res.status, data};
}
async function apiUpload(method, path, formData){
  // Like apiCall but for multipart/form-data (file uploads) — no
  // Content-Type header, the browser sets the multipart boundary itself.
  const url = API_BASE + path;
  const headers = {};
  if(State.accessToken) headers['Authorization'] = 'Bearer ' + State.accessToken;
  let res, data, text;
  try{
    res = await fetch(url, {method, headers, body: formData});
    text = await res.text();
    try{ data = text ? JSON.parse(text) : {}; }catch(e){ data = {raw:text}; }
  }catch(networkErr){
    return {ok:false, status:0, data:{message:'Could not reach the server. Check your connection.'}};
  }
  if(res.status===401 && State.refreshToken){
    const refreshed = await tryRefresh();
    if(refreshed){
      headers['Authorization'] = 'Bearer ' + State.accessToken;
      res = await fetch(url, {method, headers, body: formData});
      text = await res.text();
      try{ data = text ? JSON.parse(text) : {}; }catch(e){ data = {raw:text}; }
    }
  }
  return {ok:res.ok, status:res.status, data};
}
async function tryRefresh(){
  try{
    const r = await fetch(API_BASE+'/auth/token/refresh', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: State.refreshToken})
    });
    if(!r.ok) return false;
    const d = await r.json();
    const newAccess = d.access_token || d.data?.access_token;
    if(newAccess){ State.accessToken = newAccess; localStorage.setItem('cb_access_token', newAccess); return true; }
    return false;
  }catch(e){ return false; }
}
function friendlyError(data, status){
  if(!status) return 'Could not reach the server.';
  return (data && (data.message || data.detail || (data.error && data.error.message) || data.error)) || `Something went wrong (code ${status}).`;
}

async function doLogin(){
  const identifier = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.textContent='';
  if(!identifier || !password){ err.textContent='Please enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await apiCall('POST','/auth/login',{auth:false, body:{email: identifier, identifier, password}});
  btn.disabled = false; btn.textContent = 'Sign In';
  if(r.ok){
    const d = r.data.data || r.data;
    const access = d.access_token || d.accessToken;
    const refresh = d.refresh_token || d.refreshToken;
    const user = d.user || {};
    if(!access){ err.textContent='Signed in, but no session token was returned. Please contact the developer.'; return; }
    // Admin-only gate: this panel must never be enterable by a plain "user" account.
    // We check the role returned with the login response AND immediately verify it
    // again against /users/me before showing any admin UI (see enterApp/checkAdminAccess).
    if(!isAdminRole(user.role)){
      err.textContent = 'This panel is for administrators only. Your account does not have admin access.';
      return;
    }
    State.accessToken = access; State.refreshToken = refresh || '';
    State.userEmail = identifier;
    State.userRole = user.role || '';
    localStorage.setItem('cb_access_token', access);
    localStorage.setItem('cb_refresh_token', refresh||'');
    localStorage.setItem('cb_user_email', identifier);
    localStorage.setItem('cb_user_role', user.role || '');
    enterApp();
  } else {
    err.textContent = friendlyError(r.data, r.status);
  }
}

/* Only 'admin' and 'super_admin' may use this panel. Plain 'user' accounts
   are rejected here even though the backend also enforces this per-endpoint —
   this keeps regular users from ever seeing the admin shell at all. */
function isAdminRole(role){
  return role === 'admin' || role === 'super_admin';
}

/* Re-checks the current session against the server (source of truth) rather
   than trusting whatever role is cached in localStorage. Called on page load
   before an existing session is allowed to auto-enter the app, and used to
   kick out any session that no longer has admin rights (e.g. role was
   revoked, or a stale/forged localStorage value). */
async function verifyAdminSession(){
  const r = await apiCall('GET','/users/me',{});
  if(!r.ok){
    doLogout();
    return false;
  }
  const me = r.data.data || r.data;
  if(!isAdminRole(me.role)){
    doLogout();
    const err = document.getElementById('loginErr');
    if(err) err.textContent = 'This panel is for administrators only. Your account does not have admin access.';
    return false;
  }
  State.userRole = me.role;
  localStorage.setItem('cb_user_role', me.role);
  return true;
}
function doLogout(){
  localStorage.removeItem('cb_access_token');
  localStorage.removeItem('cb_refresh_token');
  localStorage.removeItem('cb_user_email');
  localStorage.removeItem('cb_user_role');
  State.accessToken=''; State.refreshToken=''; State.userRole='';
  document.getElementById('app').classList.remove('active');
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
function enterApp(){
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  document.getElementById('whoami').textContent = State.userEmail || 'Admin';
  buildNav();
  goSection('dashboard');
}

const dt = v => v ? new Date(v).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}) + ' IST' : '—';
// Converts an ISO datetime string to the 'YYYY-MM-DDTHH:mm' value a
// <input type="datetime-local"> expects, rendered in IST (matches the
// '+05:30' offset collectFields() stamps back on when saving).
function toDatetimeLocalIST(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d.getTime())) return '';
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12:false,
  }).formatToParts(d).reduce((acc,p)=>{ acc[p.type]=p.value; return acc; }, {});
  return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`;
}
const methodDetailsFmt = v => {
  if(!v || typeof v !== 'object') return '—';
  const parts = Object.entries(v).filter(([k,val])=>val!=null && val!=='').map(([k,val])=>`${k.replace(/_/g,' ')}: ${val}`);
  return parts.length ? parts.join('<br>') : '—';
};
const proofLinkFmt = v => v ? `<a href="${v}" target="_blank" rel="noopener">View Proof</a>` : '<span class="cellMuted">—</span>';
// Actual visible thumbnail (not just a text link) so an admin can see
// the screenshot at a glance while reviewing a claim. Click opens the
// full-size image in a new tab. onerror swaps in a note instead of a
// silently broken image icon, in case the stored URL isn't reachable
// (e.g. bucket not public).
const proofThumbFmt = v => v ? `
  <a href="${v}" target="_blank" rel="noopener" style="display:inline-block;">
    <img src="${v}" alt="Proof screenshot" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border,#333);display:block;"
      onerror="this.outerHTML='<span class=&quot;cellMuted&quot;>Image unavailable</span>'">
  </a>` : '<span class="cellMuted">No proof (loss claim)</span>';
const upiQrFmt = (v, row) => {
  if(!v || typeof v !== 'object') return '<span class="cellMuted">—</span>';
  const status = String((row && row.status) || '').toLowerCase();
  if(['completed','paid','success','rejected','cancelled','canceled','failed'].some(s=>status.includes(s))){
    return '<span class="cellMuted">—</span>';
  }
  const upiId = v.upi_id || v.upi || v.vpa || v.upi_number || v.upi_address;
  if(!upiId) return '<span class="cellMuted">—</span>';
  const payeeName = (v.account_holder_name || v.name || v.holder_name || 'Payout').toString();
  const amount = row && row.amount != null ? row.amount : '';
  const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}${amount?`&am=${encodeURIComponent(amount)}`:''}&cu=INR`;
  const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUri)}`;
  return `<img src="${qrImg}" alt="UPI QR for ${escapeHtmlAdmin(upiId)}" class="upiQrThumb" loading="lazy" onclick="openUpiQrModal('${escapeHtmlAdmin(upiId)}','${escapeHtmlAdmin(payeeName)}','${qrImg.replace(/'/g,"%27")}')">`;
};
const statusBadge = v => {
  if(v==null) return '<span class="badge gray">—</span>';
  const s = String(v).toLowerCase();
  let cls='gray';
  if(['active','approved','completed','success','verified','online','paid','won','ok','confirmed'].some(x=>s.includes(x))) cls='ok';
  else if(['pending','review','processing','scheduled','hold','in_progress'].some(x=>s.includes(x))) cls='warn';
  else if(['rejected','failed','banned','cancelled','canceled','locked','suspended','frozen'].some(x=>s.includes(x))) cls='danger';
  else cls='info';
  return `<span class="badge ${cls}">${v}</span>`;
};

/* ============================================================
   NAV
============================================================ */
function buildNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  let lastGroup = null;
  MODULES.forEach(m=>{
    if(m.group && m.group!==lastGroup){
      lastGroup = m.group;
      const g = document.createElement('div');
      g.className='navGroupLabel'; g.textContent=m.group;
      nav.appendChild(g);
    }
    const el = document.createElement('div');
    el.className = 'navItem'; el.id = 'nav-'+m.key;
    el.innerHTML = `<span class="ic">${m.icon}</span><span>${m.label}</span>`;
    el.onclick = ()=>goSection(m.key);
    nav.appendChild(el);
  });
}
function goSection(key){
  if(typeof teardownSupport==='function') teardownSupport();
  State.section = key;
  document.querySelectorAll('.navItem').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+key); if(navEl) navEl.classList.add('active');
  const mod = MODULES.find(m=>m.key===key);
  document.getElementById('pageTitle').textContent = mod.label;
  document.getElementById('pageSub').textContent = mod.desc || 'Overview of your platform';
  if(key==='dashboard') renderDashboard();
  else if(key==='matches') renderMatches();
  else if(key==='results') renderTournamentResults();
  else if(key==='customresults') renderCustomResults();
  else if(key==='history') renderTournamentHistory();
  else if(key==='prize') renderPrizesPayouts();
  else if(key==='support') renderSupport();
  else renderModule(mod);
}

   DASHBOARD
============================================================ */
async function renderDashboard(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="grid grid-4" id="statGrid">
      ${['Total Users','Total Tournaments','Active Matches','Total Teams'].map(l=>`
        <div class="glass statCard"><div class="lbl">${l}</div><div class="val"><span class="spinner"></span></div></div>
      `).join('')}
    </div>
    <div class="glass pane" style="margin-top:16px;">
      <div class="sectionHead"><div><h3>Welcome back</h3><div class="desc">Quick snapshot of platform activity</div></div></div>
      <div id="dashMsg"></div>
    </div>`;
  const r = await apiCall('GET','/admin/dashboard/overview');
  const vals = document.querySelectorAll('#statGrid .val');
  if(r.ok){
    const raw = r.data.data || r.data;
    const t = raw.totals || raw;
    const map = [
      [t.total_users, 'accent'],
      [t.total_tournaments, 'ok'],
      [t.active_matches, 'accent'],
      [t.total_teams, 'warn'],
    ];
    vals.forEach((v,i)=>{ v.textContent = map[i][0] ?? '—'; v.className='val '+map[i][1]; });
    document.getElementById('dashMsg').innerHTML = `<div class="hint">Data refreshed just now. Use the menu on the left to manage each area of the platform.</div>`;
  } else {
    vals.forEach(v=>v.innerHTML='<span style="color:var(--danger);font-size:14px;">—</span>');
    document.getElementById('dashMsg').innerHTML = `<div class="banner err">${friendlyError(r.data,r.status)}</div>`;
  }
}

function openCreateTournamentModal(){
  const fields = [
    {name:'title', label:'Title', required:true},
    {name:'organizer', label:'Organizer', required:true},
    {name:'game_id', label:'Game', type:'game-select', required:true},
    {name:'starts_at', label:'Starts At (IST)', type:'datetime-local'},
    {name:'entry_fee', label:'Entry Fee', type:'number'},
    {name:'prize_pool', label:'Prize Pool', type:'number'},
    {name:'prize_type', label:'Prize Type', type:'select', options:['rank','per_kill','win']},
    {name:'rank_prize_rules', label:'Rank Prizes (JSON — used when Prize Type=rank)', type:'json', placeholder:'[{"rank":1,"amount":500},{"rank":2,"amount":300}]'},
    {name:'per_kill_amount', label:'₹ per Kill (used when Prize Type=per_kill)', type:'number'},
    {name:'win_amount', label:'₹ for Win (used when Prize Type=win)', type:'number'},
    {name:'max_players', label:'Max Players', type:'number', required:true},
    {name:'registration_mode', label:'Registration Mode', type:'select', options:['solo','team_invite','auto_random']},
    {name:'team_size', label:'Team Size (1=Solo, 2=Duo, 3+=Squad)', type:'number'},
    {name:'visibility', label:'Visibility', type:'select', options:['public','private','unlisted']},
    {name:'banner_url', label:'Banner Image URL', placeholder:'https://…'},
    {name:'cover_url', label:'Cover Image URL', placeholder:'https://…'},
    {name:'description', label:'Description', type:'textarea'},
  ];
  buildModal('Create Tournament', 'This tournament is itself the match players join and play', fields, async ()=>{
    const {out, missing} = collectFields(fields);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const r = await apiCall('POST', `/tournaments`, {body: out});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Tournament created.</div>`;
      setTimeout(()=>{ closeModal(); loadTournamentsList(); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  }, 'Create');
  populateGameSelects(fields);
}

async function openEditTournamentModal(tournamentId){
  const c = document.getElementById('modalOverlay');
  c.classList.add('active');
  document.getElementById('modalCard').innerHTML = `<div class="mhead"><h3>Loading…</h3></div><div class="loadingRow" style="padding:24px;"><span class="spinner"></span> Fetching tournament details…</div>`;
  const r = await apiCall('GET', `/tournaments/${tournamentId}`);
  if(!r.ok){
    document.getElementById('modalCard').innerHTML = `<div class="mhead"><h3>Error</h3><div class="closeX" onclick="closeModal()">✕</div></div><div style="padding:24px;"><div class="banner err">${friendlyError(r.data,r.status)}</div></div>`;
    return;
  }
  const t = r.data.data || r.data;
  const fields = [
    {name:'title', label:'Title', required:true, value:t.title},
    {name:'organizer', label:'Organizer', required:true, value:t.organizer},
    {name:'starts_at', label:'Starts At (IST)', type:'datetime-local', value:toDatetimeLocalIST(t.starts_at)},
    {name:'description', label:'Description', type:'textarea', value:t.description},
    {name:'rules', label:'Rules', type:'textarea', value:t.rules},
    {name:'mode_id', label:'Mode ID', value:t.mode_id},
    {name:'map_id', label:'Map ID', value:t.map_id},
    {name:'entry_fee', label:'Entry Fee', type:'number', value:t.entry_fee},
    {name:'prize_pool', label:'Prize Pool', type:'number', value:t.prize_pool},
    {name:'prize_type', label:'Prize Type', type:'select', options:['rank','per_kill','win'], value:t.prize_type},
    {name:'rank_prize_rules', label:'Rank Prizes (JSON — used when Prize Type=rank)', type:'json', placeholder:'[{"rank":1,"amount":500},{"rank":2,"amount":300}]', value:t.rank_prize_rules?JSON.stringify(t.rank_prize_rules):''},
    {name:'per_kill_amount', label:'₹ per Kill (used when Prize Type=per_kill)', type:'number', value:t.per_kill_amount},
    {name:'win_amount', label:'₹ for Win (used when Prize Type=win)', type:'number', value:t.win_amount},
    {name:'max_players', label:'Max Players', type:'number', required:true, value:t.max_players},
    {name:'max_teams', label:'Max Teams', type:'number', value:t.max_teams},
    {name:'visibility', label:'Visibility', type:'select', options:['public','private','unlisted'], value:t.visibility},
    {name:'banner_url', label:'Banner Image URL', placeholder:'https://…', value:t.banner_url},
    {name:'cover_url', label:'Cover Image URL', placeholder:'https://…', value:t.cover_url},
    {name:'is_featured', label:'Featured', type:'select', options:['false','true'], value:String(!!t.is_featured)},
    {name:'daily_slot_times', label:'Daily Slot Times', type:'csv', placeholder:'e.g. 10:00, 10:30, 11:00', value:(t.daily_slot_times||[]).join(', ')},
  ];
  buildModal(`Edit — ${t.title}`, 'Registration mode and team size are locked once players have joined, so they are not editable here.', fields, async ()=>{
    const {out, missing} = collectFields(fields);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    if('is_featured' in out) out.is_featured = (out.is_featured === 'true');
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Saving…</div>`;
    const res = await apiCall('PATCH', `/tournaments/${tournamentId}`, {body: out});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(res.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Tournament updated.</div>`;
      setTimeout(()=>{ closeModal(); loadTournamentsList(); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(res.data, res.status)}</div>`;
    }

  // (batch-generation) order, so slots show shuffled instead of by their
  // actual scheduled time (e.g. a 10:00 slot below an 8:00 PM one).
  const query = {page:1, page_size:50, sort_by:'starts_at', sort_order:'asc'};

      <div class="sectionHead"><div><h3>Tournaments</h3></div></div>

async function saveMatchResult(tournamentId, userId){
  const kills = Number(document.getElementById(`mr-kills-${userId}`).value || 0);
  const isWinner = document.getElementById(`mr-winner-${userId}`).checked;
  const rankRaw = document.getElementById(`mr-rank-${userId}`).value;
  const rank = rankRaw !== '' ? Number(rankRaw) : null;
  const r = await apiCall('POST', `/tournaments/${encodeURIComponent(tournamentId)}/admin/players/${encodeURIComponent(userId)}/result`,
    {body:{kills, is_winner:isWinner, rank}});
  if(r.ok){
    const holder = document.getElementById('mt-results-'+tournamentId);
    const dr = await apiCall('GET', `/tournaments/${encodeURIComponent(tournamentId)}/admin/details`);
    if(dr.ok) renderMatchResultsPanel(holder, dr.data.data || dr.data);
  } else { alert(friendlyError(r.data, r.status)); }
}

function openPayWinnerModal(tournamentId, userId){
  buildModal('Pay Winner', `Credit winnings straight to this player's wallet.`, [
    {name:'amount', label:'Amount', type:'number', required:true},
    {name:'note', label:'Note'},
  ], async ()=>{
    const {out, missing} = collectFields([{name:'amount',label:'Amount',required:true,type:'number'},{name:'note',label:'Note'}]);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const voiceDone = playProcessingAndWait();
    const r = await apiCall('POST', `/tournaments/${encodeURIComponent(tournamentId)}/admin/players/${encodeURIComponent(userId)}/pay`, {body:out});
    await voiceDone;
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      playVoice('completed');
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — winner paid.</div>`;
      setTimeout(async ()=>{
        closeModal();
        const holder = document.getElementById('mt-results-'+tournamentId);
        const dr = await apiCall('GET', `/tournaments/${encodeURIComponent(tournamentId)}/admin/details`);
        if(dr.ok && holder) renderMatchResultsPanel(holder, dr.data.data || dr.data);
      }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  }, 'Pay');
}

/* ============================================================
   CUSTOM RESULT VERIFICATION — self-declared win/loss claims from
   1v1 Custom Tournaments. The backend list is a flat queue of
   pending claims; group them here by tournament so an admin
   reviews one tournament's claim(s) at a time instead of hunting
   through a mixed list. Expand a tournament to see each player's
   claim (outcome, proof screenshot, opponent's counter-claim) and
   approve/reject right there.
============================================================ */
async function renderCustomResults(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="glass pane">
      <div class="sectionHead"><div><h3>Custom Result Verification</h3><div class="desc">Pending win/loss claims, grouped by tournament — expand a tournament to review and approve/reject each claim</div></div></div>
      <div class="tblToolbar">
        <button class="btn btn-ghost btn-sm" onclick="loadCustomResultsList()">Refresh</button>
      </div>
    </div>
    <div id="cr-body"></div>
  `;
  loadCustomResultsList();
}

async function loadCustomResultsList(){
  const body = document.getElementById('cr-body');
  body.innerHTML = `<div class="glass pane"><div class="loadingRow"><span class="spinner"></span> Loading…</div></div>`;
  const r = await apiCall('GET', `/admin/custom-results/pending`, {query:{page:1, page_size:100}});
  if(!r.ok){
    body.innerHTML = `<div class="glass pane"><div class="banner err">${friendlyError(r.data, r.status)}</div></div>`;
    return;
  }
  const claims = extractItems(r.data);
  if(!claims.length){
    body.innerHTML = `<div class="glass pane"><div class="empty">No pending claims — nothing needs review right now.</div></div>`;
    return;
  }

  // Group claims by tournament so each tournament's claim(s) are
  // reviewed together rather than scattered across a flat list.
  const byTournament = new Map();
  for(const claim of claims){
    const key = claim.tournament_id;
    if(!byTournament.has(key)) byTournament.set(key, {tournament_id: key, tournament_title: claim.tournament_title, claims: []});
    byTournament.get(key).claims.push(claim);
  }
  window._crGroups = byTournament;

  const rows = [...byTournament.values()].map(g=>`
    <tr>
      <td>${g.tournament_title||'—'}<div class="cellMuted">${g.tournament_id}</div></td>
      <td>${g.claims.length} pending claim${g.claims.length===1?'':'s'}</td>
      <td><button class="btn btn-primary btn-sm" onclick="toggleCustomResultGroup('${g.tournament_id}')">Review Claims</button></td>
    </tr>
    <tr id="cr-group-row-${g.tournament_id}" style="display:none;"><td colspan="3"><div id="cr-group-${g.tournament_id}"></div></td></tr>
  `).join('');
  body.innerHTML = `<div class="glass pane"><div class="tableWrap"><table class="dataTable"><thead><tr>
    <th>Tournament</th><th>Pending</th><th>Actions</th>
  </tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

const openCrGroupIds = new Set();
function toggleCustomResultGroup(tournamentId){
  const row = document.getElementById('cr-group-row-'+tournamentId);
  const isOpen = openCrGroupIds.has(tournamentId);
  if(isOpen){ row.style.display='none'; openCrGroupIds.delete(tournamentId); return; }
  openCrGroupIds.add(tournamentId);
  row.style.display='';
  renderCustomResultGroup(tournamentId);
}

function renderCustomResultGroup(tournamentId){
  const holder = document.getElementById('cr-group-'+tournamentId);
  const group = window._crGroups.get(tournamentId);
  if(!group || !holder) return;
  const claimRows = group.claims.map(claim=>`
    <tr>
      <td class="cellMuted">${claim.id}</td>
      <td>${claim.claimant_name||'—'}</td>
      <td>${statusBadge(claim.outcome)}</td>
      <td>${proofThumbFmt(claim.proof_url)}</td>
      <td>${claim.opponent_name||'—'}</td>
      <td>${claim.opponent_outcome?statusBadge(claim.opponent_outcome):'<span class="cellMuted">—</span>'}</td>
      <td>${dt(claim.submitted_at)}</td>
      <td>
        <button class="btn btn-primary btn-sm" onclick="approveCustomClaim('${claim.id}','${tournamentId}')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="rejectCustomClaimConfirm('${claim.id}','${tournamentId}')">Reject</button>
      </td>
    </tr>
  `).join('');
  holder.innerHTML = `<div class="tableWrap"><table class="dataTable"><thead><tr>
    <th>Claim ID</th><th>Claimant</th><th>Claimed Outcome</th><th>Proof</th><th>Opponent</th><th>Opponent Outcome</th><th>Submitted</th><th>Actions</th>
  </tr></thead><tbody>${claimRows}</tbody></table></div>`;
}

async function approveCustomClaim(claimId, tournamentId){
  showPrompt({
    title: 'Approve this win claim?',

async function loadPrizesPayouts(){
  const body = document.getElementById('pp-body');
  body.innerHTML = `<div class="glass pane"><div class="loadingRow"><span class="spinner"></span> Loading winners…</div></div>`;
  const filter = document.getElementById('pp-filter') ? document.getElementById('pp-filter').value : '';

  const tr = await apiCall('GET', `/tournaments`, {query:{page:1, page_size:50, status:'completed'}});
  if(!tr.ok){
    body.innerHTML = `<div class="glass pane"><div class="banner err">${friendlyError(tr.data, tr.status)}</div></div>`;
    return;
  }
  const tournaments = extractItems(tr.data);
  if(!tournaments.length){
    body.innerHTML = `<div class="glass pane"><div class="empty">No completed tournaments yet.</div></div>`;
    return;
  }

  const detailCalls = await Promise.all(tournaments.map(t=>apiCall('GET', `/tournaments/${encodeURIComponent(t.id)}/admin/details`)));
  let winnerRows = [];
  detailCalls.forEach((r, i)=>{
    if(!r.ok) return;
    const d = r.data.data || r.data;
    const t = tournaments[i];
    (d.players||[]).filter(p=>p.rank!=null).forEach(p=>{
      winnerRows.push({tournamentId:t.id, tournamentTitle:t.title, ...p});
    });
  });

  if(filter==='unpaid') winnerRows = winnerRows.filter(p=>!p.winning_paid_at);
  if(filter==='paid') winnerRows = winnerRows.filter(p=>p.winning_paid_at);
  winnerRows.sort((a,b)=> (a.tournamentTitle||'').localeCompare(b.tournamentTitle||'') || a.rank-b.rank);

  if(!winnerRows.length){
    body.innerHTML = `<div class="glass pane"><div class="empty">No winners to show. Declare a Rank for players under Tournaments / Matches once a tournament is completed.</div></div>`;
    return;
  }

  const rows = winnerRows.map(p=>`
    <tr>
      <td>${p.tournamentTitle||'—'}</td>
      <td><span class="badge ok">#${p.rank}</span></td>
      <td>${p.full_name||'—'}<div class="cellMuted">${p.phone_number||''}</div></td>
      <td>${p.team_name||'—'}</td>
      <td>${p.kills}</td>
      <td>${p.winning_amount!=null ? money(p.winning_amount) : '—'}</td>
      <td>${p.winning_paid_at ? '<span class="badge ok">Paid</span>' : '<span class="badge warn">Unpaid</span>'}</td>
      <td>${p.winning_paid_at ? '—' : `<button class="btn btn-primary btn-sm" onclick="openPayWinnerModalFromPrizes('${p.tournamentId}','${p.user_id}')">Pay</button>`}</td>
    </tr>`).join('');
  body.innerHTML = `<div class="glass pane"><div class="tableWrap"><table class="dataTable"><thead><tr>
    <th>Tournament</th><th>Rank</th><th>Player</th><th>Team</th><th>Kills</th><th>Amount</th><th>Status</th><th>Actions</th>
  </tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function openPayWinnerModalFromPrizes(tournamentId, userId){
  buildModal('Pay Winner', `Credit winnings straight to this player's wallet.`, [
    {name:'amount', label:'Amount', type:'number', required:true},
    {name:'note', label:'Note'},
  ], async ()=>{
    const {out, missing} = collectFields([{name:'amount',label:'Amount',required:true,type:'number'},{name:'note',label:'Note'}]);
    if(missing.length){ document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: ${missing.join(', ')}</div>`; return; }
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const voiceDone = playProcessingAndWait();
    const r = await apiCall('POST', `/tournaments/${encodeURIComponent(tournamentId)}/admin/players/${encodeURIComponent(userId)}/pay`, {body:out});
    await voiceDone;
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      playVoice('completed');
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — winner paid.</div>`;
      setTimeout(()=>{ closeModal(); loadPrizesPayouts(); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  }, 'Pay');
}

async function loadTeamsByTournament(delta){
  const body = document.getElementById('teamsByTourn-body');
  const pager = document.getElementById('teamsByTourn-pager');
  if(!body) return;

  if(delta) teamsByTournState.page = Math.max(1, teamsByTournState.page + delta);

  body.innerHTML = `<div class="loadingRow"><span class="spinner"></span> Loading…</div>`;
  const query = {page: teamsByTournState.page, page_size: 15};
  if(teamsByTournState.search) query.search = teamsByTournState.search;

  const r = await apiCall('GET', '/admin/teams', {query});
  if(document.getElementById('teamsByTourn-body') !== body) return; // pane replaced meanwhile
  if(!r.ok){
    body.innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    if(pager) pager.innerHTML = '';
    return;
  }
  const items = extractItems(r.data);
  if(!items.length){
    body.innerHTML = `<div class="empty">No teams found.</div>`;
    if(pager) pager.innerHTML = '';
    return;
  }
  const rows = items.map(t=>`
    <tr>
      <td class="cellMuted">${t.team_uid||''}<div class="cellMuted">${t.id}</div></td>
      <td>${t.team_name}</td>
      <td class="cellMuted">${t.tournament_id}</td>
      <td class="cellMuted">${t.captain_id||'—'}</td>
      <td>${t.current_members}/${t.team_size}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${t.is_locked ? '<span class="badge warn">Locked</span>' : '<span class="badge ok">Open</span>'}</td>
    </tr>
  `).join('');
  body.innerHTML = `
    <div class="tableWrap"><table class="dataTable"><thead><tr>
      <th>Team</th><th>Name</th><th>Tournament</th><th>Captain</th><th>Members</th><th>Status</th><th>Locked</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  `;
  if(pager){
    pager.innerHTML = `
      <button class="btn btn-ghost btn-sm" ${teamsByTournState.page<=1?'disabled':''} onclick="loadTeamsByTournament(-1)">Previous</button>
      <span>Page ${teamsByTournState.page}</span>
      <button class="btn btn-ghost btn-sm" ${items.length<15?'disabled':''} onclick="loadTeamsByTournament(1)">Next</button>
    `;
  }
}

function extractItems(data){
  const d = data.data || data;
  if(Array.isArray(d)) return d;
  if(Array.isArray(d.items)) return d.items;
  if(Array.isArray(d.results)) return d.results;
  for(const k in d){ if(Array.isArray(d[k])) return d[k]; }
  return [];
}
function extractId(row){
  return row.id ?? row.user_id ?? row.match_id ?? row.tournament_id ?? row._id ?? '';
}

async function renderTablePane(paneId, mod, listCfg, opts={}){
  const pane = document.getElementById(paneId);
  const key = paneId;
  listState[key] = listState[key] || {page:1, search:''};
  const st = listState[key];

  pane.innerHTML = `
    <div class="sectionHead"><div><h3>${opts.title || mod.label}</h3></div></div>
    <div class="tblToolbar">
      ${listCfg.query && listCfg.query.includes('search') ? `<input class="searchInput" style="max-width:260px;margin:0;" id="${key}-search" placeholder="${listCfg.searchPlaceholder||'Search…'}" value="${escapeHtmlAdmin(st.search||'')}" oninput="debouncedSearch('${key}')">` : '<span></span>'}
      <button class="btn btn-ghost btn-sm" onclick="refreshPane('${paneId}','${mod.key}')">Refresh</button>
    </div>
    <div id="${key}-body"><div class="loadingRow"><span class="spinner"></span> Loading…</div></div>
    <div class="pager" id="${key}-pager"></div>
  `;

  paneLoaders[key] = () => loadTablePaneData(paneId, mod, listCfg, opts);
  await paneLoaders[key]();
}

async function loadTablePaneData(paneId, mod, listCfg, opts={}){
  const key = paneId;
  const st = listState[key] || (listState[key] = {page:1, search:''});
  const body = document.getElementById(key+'-body');
  const pager = document.getElementById(key+'-pager');
  if(!body) return; // pane no longer on screen (user navigated away)
  body.innerHTML = `<div class="loadingRow"><span class="spinner"></span> Loading…</div>`;

  const query = {page: st.page, page_size: 15};
  if(st.search) query.search = st.search;
  // Ask the server to sort too — without this, defaultSort below only
  // re-orders whatever 15 rows happen to land on the current page, and
  // the actual latest record (e.g. newest withdrawal) can be sitting
  // unsorted on page 2+ because the server's own default order isn't
  // newest-first. See tournaments loader for the same fix.
  if(listCfg.defaultSort){
    query.sort_by = listCfg.defaultSort.key;
    query.sort_order = listCfg.defaultSort.dir;
  }

  const r = await apiCall('GET', listCfg.path, {query});
  if(document.getElementById(key+'-body') !== body) return; // pane replaced meanwhile
  if(!r.ok){
    body.innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    return;
  }
  const items = extractItems(r.data);
  if(listCfg.defaultSort){
    const {key: sortKey, dir} = listCfg.defaultSort;
    items.sort((a,b)=>{
      const av = a[sortKey], bv = b[sortKey];
      const at = av ? new Date(av).getTime() : 0;
      const bt = bv ? new Date(bv).getTime() : 0;
      return dir==='desc' ? (bt-at) : (at-bt);
    });
  }
  if(!items.length){
    body.innerHTML = `<div class="empty">No records found.</div>`;
    if(pager) pager.innerHTML = '';
    return;
  }
  const cols = listCfg.columns;
  const rowActions = opts.rowActions || [];
  let tableHtml = `<div class="tableWrap"><table class="dataTable"><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}${rowActions.length?'<th>Actions</th>':''}</tr></thead><tbody>`;
  items.forEach(row=>{
    tableHtml += `<tr data-row-id="${escapeHtmlAdmin(String(extractId(row)))}">` + cols.map(c=>{
      let v = row[c.key];
      if(v==null) return '<td class="cellMuted">—</td>';
      return `<td>${c.fmt ? c.fmt(v, row) : String(v)}</td>`;
    }).join('');
    if(rowActions.length){
      tableHtml += `<td><div class="rowActions">${rowActions.filter(ra=>!ra.visibleWhen || ra.visibleWhen(row)).map((ra)=>{
        const i = rowActions.indexOf(ra);
        const raId = ra.idField ? (row[ra.idField] ?? extractId(row)) : extractId(row);
        return `<button class="btn ${ra.danger?'btn-danger':'btn-ghost'} btn-sm" onclick="openRowActionModal('${mod.key}','${opts.listKey||'main'}',${i},'${raId}')">${ra.label}</button>`;
      }).join('') || '<span class="cellMuted">—</span>'}</div></td>`;
    }
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table></div>';
  body.innerHTML = tableHtml;

  if(pager){
    pager.innerHTML = `
      <button class="btn btn-ghost btn-sm" ${st.page<=1?'disabled':''} onclick="changePage('${key}','${mod.key}',-1)">Previous</button>
      <span>Page ${st.page}</span>
      <button class="btn btn-ghost btn-sm" ${items.length<15?'disabled':''} onclick="changePage('${key}','${mod.key}',1)">Next</button>
    `;
  }
}
function refreshPane(paneId, modKey){ if(paneLoaders[paneId]) paneLoaders[paneId](); else goSection(State.section); }
function refreshAllPanes(){
  const keys = Object.keys(paneLoaders).filter(k=>document.getElementById(k+'-body'));
  if(!keys.length){ goSection(State.section); return; }

function removeRowById(id){

let searchTimers = {};
function debouncedSearch(key){
  clearTimeout(searchTimers[key]);
  searchTimers[key] = setTimeout(()=>{
    const input = document.getElementById(key+'-search');
    listState[key].search = input ? input.value : '';
    listState[key].page = 1;

function changePage(key, modKey, delta){
  listState[key].page = Math.max(1, (listState[key].page||1)+delta);
  if(paneLoaders[key]) paneLoaders[key](); else goSection(State.section);

function fieldInputHtml(f){
  if(f.type==='select'){
    return `<select id="mf-${f.name}">${f.options.map(o=>`<option value="${o}" ${f.value===o?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  if(f.type==='game-select'){
    return `<select id="mf-${f.name}"><option value="">Loading games…</option></select>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="mf-${f.name}" placeholder="${f.placeholder||''}">${f.value!=null?f.value:''}</textarea>`;
  }
  if(f.type==='csv'){
    return `<input id="mf-${f.name}" type="text" placeholder="${f.placeholder||'e.g. 10:00, 10:30, 11:00'}" value="${f.value!=null?f.value:''}">`;
  }
  if(f.type==='json'){
    const val = f.value!=null ? (typeof f.value==='string'?f.value:JSON.stringify(f.value,null,2)) : '';
    return `<textarea id="mf-${f.name}" style="font-family:monospace;font-size:12px;min-height:120px" placeholder="${f.placeholder||''}">${val}</textarea>`;
  }
  return `<input id="mf-${f.name}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" value="${f.value!=null?f.value:''}">`;
}

      ${fields.length ? `<div class="formGrid">${fields.map(f=>`
        <div class="field"><label>${f.label}${f.required?' *':''}</label>${fieldInputHtml(f)}</div>
      `).join('')}</div>` : `<div class="hint">No additional details needed — just confirm.</div>`}
      <div id="modalMsg"></div>

/* ============================================================
   TOASTS — replaces browser alert() with proper themed toasts
============================================================ */
function showToast(message, type='ok', duration=4000){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='ok' ? '✓' : type==='err' ? '✕' : 'i';
  el.innerHTML = `<div class="ticon">${icon}</div><div class="tbody">${message}</div><div class="tclose" onclick="dismissToast(this.parentElement)">✕</div>`;
  c.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  el._timer = setTimeout(()=> dismissToast(el), duration);
}
function dismissToast(el){
  if(!el) return;
  clearTimeout(el._timer);
  el.classList.remove('show');
  el.classList.add('hide');
  setTimeout(()=> el.remove(), 280);
}

/* ============================================================
   STYLED PROMPT — replaces browser prompt() with a themed dialog
   Usage: const vals = await showPrompt({title, desc, danger, fields:[{name,label,type,placeholder}]});
   Returns an object keyed by field name, or null if cancelled.
============================================================ */
function closePrompt(result){
  const ov = document.getElementById('promptOverlay');
  ov.classList.remove('active');
  if(ov._resolve){ ov._resolve(result); ov._resolve = null; }
}
function showPrompt({title, desc='', danger=false, confirmLabel='Confirm', fields=[], onConfirm=null}){
  const ov = document.getElementById('promptOverlay');
  const card = document.getElementById('promptCard');
  card.innerHTML = `
    <h3>${title}</h3>
    ${desc?`<div class="pdesc">${desc}</div>`:''}
    ${fields.map(f=>`
      <div class="field"><label>${f.label}${f.required!==false?' *':''}</label>
        ${f.type==='textarea'
          ? `<textarea id="pf-${f.name}" placeholder="${f.placeholder||''}"></textarea>`
          : f.type==='select'
          ? `<select id="pf-${f.name}">${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`
          : `<input id="pf-${f.name}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" ${f.min!=null?`min="${f.min}"`:''}>`}
      </div>
    `).join('')}
    <div class="perr" id="promptErr"></div>
    <div class="actionsBar">
      <button class="btn ${danger?'btn-danger':'btn-primary'}" style="width:auto;" id="promptOkBtn">${confirmLabel}</button>
      <button class="btn btn-ghost" onclick="closePrompt(null)" id="promptCancelBtn">Cancel</button>
    </div>
  `;
  ov.classList.add('active');
  setTimeout(()=>{ const first = card.querySelector('input,textarea'); if(first) first.focus(); }, 50);

  document.getElementById('promptOkBtn').onclick = async ()=>{
    const out = {};
    for(const f of fields){
      const el = document.getElementById('pf-'+f.name);
      let v = el.value.trim();
      if(f.required!==false && !v){
        document.getElementById('promptErr').textContent = `Please fill: ${f.label}`;
        el.focus();
        return;
      }
      if(f.type==='number'){
        const num = Number(v);
        if(v && (isNaN(num) || (f.min!=null && num < f.min))){
          document.getElementById('promptErr').textContent = `${f.label} must be a valid number${f.min!=null?` ≥ ${f.min}`:''}.`;
          el.focus();
          return;
        }
        v = num;
      }
      out[f.name] = v;
    }
    if(onConfirm){
      const okBtn = document.getElementById('promptOkBtn');
      const cancelBtn = document.getElementById('promptCancelBtn');
      const origHtml = okBtn.innerHTML;
      okBtn.disabled = true; cancelBtn.disabled = true;
      okBtn.innerHTML = '<span class="spinner"></span> Working…';
      document.getElementById('promptErr').textContent = '';
      try{
        const res = await onConfirm(out);
        if(res && res.ok===false){
          document.getElementById('promptErr').textContent = res.error || 'Something went wrong.';
          okBtn.disabled = false; cancelBtn.disabled = false; okBtn.innerHTML = origHtml;
          return;
        }
      }catch(e){
        document.getElementById('promptErr').textContent = (e && e.message) || 'Something went wrong.';
        okBtn.disabled = false; cancelBtn.disabled = false; okBtn.innerHTML = origHtml;
        return;
      }
    }
    closePrompt(out);
  };

  return new Promise(resolve => { ov._resolve = resolve; });
}

function collectFields(fields){
  const out = {}; let missing = [];
  fields.forEach(f=>{
    const el = document.getElementById('mf-'+f.name);
    let v = el.value;
    if(f.required && !v){ missing.push(f.label); }
    if(v==='') return;
    if(f.type==='number') out[f.name] = Number(v);
    else if(f.type==='csv') out[f.name] = v.split(',').map(s=>s.trim()).filter(Boolean);
    else if(f.type==='datetime-local') out[f.name] = v + ':00+05:30'; // explicit IST offset, unambiguous for backend
    else if(f.type==='json'){
      try{ out[f.name] = JSON.parse(v); }
      catch(e){ missing.push(`${f.label} (invalid JSON)`); }
    }
    else out[f.name] = v;
  });
  return {out, missing};
}

function generateSlotTimes(firstTime, lastTime, intervalMin){
  const [fh, fm] = firstTime.split(':').map(Number);
  const [lh, lm] = lastTime.split(':').map(Number);
  let cur = fh*60 + fm;
  const end = lh*60 + lm;
  const times = [];
  while(cur <= end){
    const h = String(Math.floor(cur/60)).padStart(2,'0');
    const m = String(cur%60).padStart(2,'0');
    times.push(`${h}:${m}`);
    cur += intervalMin;
  }
  return times;
}

/* Prize type config (Rank / Per Kill / Win) shared by the Create and
   Edit Schedule modals, and by the per-tournament edit modal. `s` is
   the existing schedule/tournament record when editing ({} when
   creating). Renders the amount field(s) matching whichever
   prize_type is currently selected in #mf-prize_type. */
function rankPrizeRulesToText(rules){
  if(!Array.isArray(rules) || !rules.length) return '';
  return rules.map(r=>`${r.rank}:${r.amount}`).join(', ');
}
function parseRankPrizeRulesText(text){
  const parts = String(text||'').split(',').map(s=>s.trim()).filter(Boolean);
  const rules = [];
  for(const p of parts){
    const m = p.match(/^(\d+)\s*:\s*([\d.]+)$/);
    if(!m) throw new Error(`Invalid rank prize entry "${p}" — use "rank:amount", e.g. "1:500, 2:300, 3:200"`);
    rules.push({rank: Number(m[1]), amount: Number(m[2])});
  }
  if(!rules.length) throw new Error('Add at least one rank prize, e.g. "1:500, 2:300, 3:200"');
  return rules;
}
function prizeFieldsHtml(type, s){
  s = s || {};
  if(type === 'per_kill'){
    return `<div class="field"><label>₹ per Kill *</label><input id="mf-per_kill_amount" type="number" step="0.01" placeholder="e.g. 10" value="${s.per_kill_amount??''}"></div>`;
  }
  if(type === 'win'){
    return `<div class="field"><label>₹ for Win *</label><input id="mf-win_amount" type="number" step="0.01" placeholder="e.g. 500" value="${s.win_amount??''}"></div>`;
  }
  return `<div class="field" style="grid-column:1/-1;"><label>Rank Prizes * (format "rank:amount", comma-separated)</label><input id="mf-rank_prize_rules" type="text" placeholder="e.g. 1:500, 2:300, 3:200" value="${rankPrizeRulesToText(s.rank_prize_rules)}"></div>`;
}
function bindPrizeTypeSelect(containerId, selectId, s){
  const render = ()=>{
    document.getElementById(containerId).innerHTML = prizeFieldsHtml(document.getElementById(selectId).value, s);
  };
  document.getElementById(selectId).onchange = render;
  render();
}
/* Reads whichever prize fields are currently visible and returns the
   {prize_type, rank_prize_rules?, per_kill_amount?, win_amount?} slice
   to merge into a request body. Throws on invalid rank-prize text so
   callers can surface the message in modalMsg. */
function collectPrizeFields(selectId){
  const prize_type = document.getElementById(selectId).value;
  if(prize_type === 'per_kill'){
    const v = document.getElementById('mf-per_kill_amount').value;
    if(v==='') throw new Error('Please fill: ₹ per Kill');
    return {prize_type, per_kill_amount: Number(v)};
  }
  if(prize_type === 'win'){
    const v = document.getElementById('mf-win_amount').value;
    if(v==='') throw new Error('Please fill: ₹ for Win');
    return {prize_type, win_amount: Number(v)};
  }
  const text = document.getElementById('mf-rank_prize_rules').value;
  return {prize_type, rank_prize_rules: parseRankPrizeRulesText(text)};
}


const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function looksLikeUuid(v){ return UUID_RE.test(String(v||'').trim()); }
/* Lets admin forms accept a player's short UID (e.g. "AB12CD34") in a
   user_id field, instead of forcing them to look up the raw UUID first.
   If the value isn't already a UUID, resolves it via the admin user
   search endpoint (matches player_uid exactly). Returns the resolved
   UUID, or null if no unique match was found. */
async function resolveUidField(value){
  const v = String(value||'').trim();
  if(!v) return null;
  if(looksLikeUuid(v)) return v;
  const r = await apiCall('GET', '/admin/users', {query:{search:v, page:1, page_size:10}});
  if(!r.ok) return null;
  const items = extractItems(r.data) || [];
  const exact = items.find(u => (u.player_uid||'').toLowerCase() === v.toLowerCase());
  if(exact) return exact.id;
  if(items.length === 1) return items[0].id;
  return null;
}
/* Resolves every acceptsUid field in `out`/`bodyOut` in place. Returns an
   error message to show (and abort submission) or null on success. */
async function resolveUidFields(fields, out, bodyOut){
  for(const f of fields){
    if(!f.acceptsUid) continue;
    const raw = out[f.name];
    if(raw === undefined || raw === '' || looksLikeUuid(raw)) continue;
    const resolved = await resolveUidField(raw);
    if(!resolved){
      return `Couldn't find a user with UID "${raw}" — check the UID or use the full User ID.`;
    }
    out[f.name] = resolved;
    if(bodyOut && (f.name in bodyOut)) bodyOut[f.name] = resolved;
  }
  return null;
}


async function fetchGameOptionsHtml(selectedId){
  const r = await apiCall('GET', '/games', {query:{}});

  return `<option value="">Select a game…</option>` + items.map(g=>

    </tbody></table></div>` : `<div class="hint">No tournament/match history yet.</div>`;
    return;
  }

  if(tab==='reports'){
    const r = await apiCall('GET', '/admin/reports', {query:{page:1, page_size:100}});
    if(!r.ok){ pane.innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`; return; }

    </tbody></table></div>` : `<div class="hint">No reports involving this user.</div>`;
    return;
  }

  if(tab==='appeals'){
    const r = await apiCall('GET', '/admin/appeals', {query:{page:1, page_size:100}});
    if(!r.ok){ pane.innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`; return; }

async function profileWalletAction(kind){
  const {userId, wallet} = profileState;

  if(kind==='freeze'){
    const nowFrozen = !(wallet && wallet.is_frozen);
    const vals = await showPrompt({
      title: nowFrozen ? 'Freeze Wallet' : 'Unfreeze Wallet',
      desc: nowFrozen ? 'The user won\'t be able to spend or withdraw while frozen.' : 'This restores normal wallet activity for the user.',
      danger: nowFrozen,
      confirmLabel: nowFrozen ? 'Freeze' : 'Unfreeze',
      fields: [{name:'reason', label:'Reason', type:'textarea'}],
      onConfirm: async (out)=>{
        const r = await apiCall('PATCH', `/admin/wallets/${encodeURIComponent(userId)}/freeze`, {body:{is_frozen:nowFrozen, reason:out.reason}});
        if(!r.ok) return {ok:false, error: friendlyError(r.data, r.status)};
        showToast(nowFrozen ? 'Wallet frozen.' : 'Wallet unfrozen.', 'ok');
        await openUserProfileModal(userId);
      },
    });
    return;
  }

  const vals = await showPrompt({
    title: kind==='credit' ? 'Credit Wallet' : 'Debit Wallet',
    desc: kind==='credit' ? 'Add funds to this user\'s wallet.' : 'Remove funds from this user\'s wallet.',
    danger: kind==='debit',
    confirmLabel: kind==='credit' ? 'Credit' : 'Debit',
    fields: [
      {name:'amount', label:'Amount (₹)', type:'number', min:0.01},
      {name:'reason', label:'Reason', type:'textarea'},
    ],
    onConfirm: async (out)=>{
      if(!out.reason || out.reason.trim().length<3) return {ok:false, error:'Reason must be at least 3 characters.'};
      const voiceDone = playProcessingAndWait();
      const r = await apiCall('POST', `/admin/wallets/${encodeURIComponent(userId)}/${kind}`, {body:{amount:out.amount, reason:out.reason}});
      await voiceDone;
      if(!r.ok) return {ok:false, error: friendlyError(r.data, r.status)};
      playVoice('completed');
      showToast(kind==='credit' ? 'Wallet credited.' : 'Wallet debited.', 'ok');
      await openUserProfileModal(userId);
    },
  });
}

async function openBroadcastModal(){
  buildModal('Broadcast Notification', 'Notifications', [], ()=>{}, 'Send');
  document.getElementById('modalBody').innerHTML = `
    <div class="formGrid">
      <div class="field"><label>Title *</label><input id="mf-title" type="text" placeholder="Notification title"></div>
      <div class="field"><label>Message *</label><textarea id="mf-body" placeholder="Notification message"></textarea></div>
      <div class="field"><label>Send Via *</label>
        <select id="mf-channel">
          <option value="in_app_push">In-App + Push</option>
          <option value="email">Email</option>
          <option value="both">Both (In-App + Push and Email)</option>
        </select>
      </div>
      <div class="field"><label>Target User IDs or Player UIDs (optional, comma-separated — leave empty for all users)</label><input id="mf-target_user_ids" type="text" placeholder="e.g. AB12CD34, uuid2"></div>
    </div>
    <div id="modalMsg"></div>
    <div class="actionsBar">
      <button class="btn btn-primary" style="width:auto;" id="modalSubmitBtn">Send</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div id="modalResult"></div>
  `;
  document.getElementById('modalSubmitBtn').onclick = async ()=>{
    const title = document.getElementById('mf-title').value.trim();
    const body = document.getElementById('mf-body').value.trim();
    const channel = document.getElementById('mf-channel').value;
    const targetRaw = document.getElementById('mf-target_user_ids').value.trim();
    if(!title || !body){
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">Please fill: Title, Message</div>`;
      return;
    }
    const payload = {
      title,
      body,
      send_push: (channel==='in_app_push' || channel==='both'),
      send_email: (channel==='email' || channel==='both'),
    };
    if(targetRaw){
      const rawIds = targetRaw.split(',').map(s=>s.trim()).filter(Boolean);
      // Each entry may be a full user UUID or a short player UID (e.g.
      // "AB12CD34") — resolve any non-UUID entries via the same lookup
      // used elsewhere (resolveUidField), so admins can paste player UIDs
      // straight from a player's profile instead of hunting for the UUID.
      document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Resolving target user(s)…</div>`;
      const resolvedIds = [];
      const unresolved = [];
      for(const rawId of rawIds){
        if(looksLikeUuid(rawId)){ resolvedIds.push(rawId); continue; }
        const resolved = await resolveUidField(rawId);
        if(resolved) resolvedIds.push(resolved);
        else unresolved.push(rawId);
      }
      if(unresolved.length){
        document.getElementById('modalMsg').innerHTML = `<div class="banner err">Couldn't find a user for UID(s): ${unresolved.join(', ')} — check the UID or use the full User ID.</div>`;
        return;
      }
      payload.target_user_ids = resolvedIds;
    }
    document.getElementById('modalSubmitBtn').disabled = true;
    document.getElementById('modalMsg').innerHTML = `<div class="loadingRow"><span class="spinner"></span> Working…</div>`;
    const r = await apiCall('POST', '/admin/notifications/broadcast', {body: payload});
    document.getElementById('modalSubmitBtn').disabled = false;
    if(r.ok){
      document.getElementById('modalMsg').innerHTML = `<div class="banner ok">Done — request completed successfully.</div>`;
      setTimeout(()=>{ closeModal(); refreshAllPanes(); }, 900);
    } else {
      document.getElementById('modalMsg').innerHTML = `<div class="banner err">${friendlyError(r.data, r.status)}</div>`;
    }
  };
}
