<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ClassyBattle — Enter the Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg-0:#050611;
  --bg-1:#090b1a;
  --bg-2:#0d1024;
  --glass:rgba(255,255,255,0.055);
  --glass-hi:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.14);
  --glass-border-hi:rgba(255,255,255,0.28);
  --accent-1:#7c6cff;      /* violet-plasma */
  --accent-1-soft:rgba(124,108,255,0.35);
  --accent-2:#ff3ea5;      /* neon magenta */
  --accent-2-soft:rgba(255,62,165,0.35);
  --accent-3:#3effc0;      /* acid mint — wins / live / success */
  --accent-3-soft:rgba(62,255,192,0.30);
  --accent-warn:#ffb23e;
  --accent-danger:#ff5470;
  --text-hi:#f3f3fb;
  --text-mid:#c3c4dc;
  --text-muted:#82849f;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --font-display:'Orbitron', sans-serif;
  --font-body:'Space Grotesk', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-0);
  color:var(--text-hi);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;} }

/* ============================= BACKDROP ============================= */
.bg-field{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(ellipse 90% 60% at 15% -10%, rgba(124,108,255,0.28), transparent 60%),
  radial-gradient(ellipse 80% 55% at 100% 15%, rgba(255,62,165,0.20), transparent 55%),
  radial-gradient(ellipse 70% 60% at 50% 120%, rgba(62,255,192,0.14), transparent 60%),
  linear-gradient(180deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
}
.bg-field::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 20%, black, transparent 75%);
  animation:gridDrift 40s linear infinite;
}
@keyframes gridDrift{from{background-position:0 0;}to{background-position:104px 208px;}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:blobFloat 22s var(--ease) infinite alternate;}
.blob.b1{width:480px;height:480px;background:var(--accent-1);top:-140px;left:-120px;}
.blob.b2{width:420px;height:420px;background:var(--accent-2);top:10%;right:-160px;animation-delay:-6s;}
.blob.b3{width:380px;height:380px;background:var(--accent-3);bottom:-160px;left:30%;animation-delay:-12s;}
@keyframes blobFloat{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,-30px) scale(1.12);}}

/* ============================= GLASS PRIMITIVES ============================= */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  position:relative;
}
.glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg, rgba(255,255,255,0.10), transparent 40%);
  mix-blend-mode:overlay;
}
.glass-soft{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.09);border-radius:var(--radius-md);backdrop-filter:blur(14px);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:20px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.24);background-clip:padding-box;}

/* ============================= TYPE ============================= */
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.02em;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-3);}
.mono{font-family:var(--font-mono);}
.muted{color:var(--text-muted);}
p{color:var(--text-mid);line-height:1.55;}
a{color:inherit;}

/* ============================= BUTTONS ============================= */
.btn{
  font-family:var(--font-body);font-weight:600;font-size:14px;
  padding:12px 22px;border-radius:999px;border:1px solid var(--glass-border);
  background:var(--glass-hi);color:var(--text-hi);cursor:pointer;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);border-color:var(--glass-border-hi);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--accent-1), #5b48f0);border:none;box-shadow:0 6px 24px var(--accent-1-soft);}
.btn-primary:hover{box-shadow:0 10px 30px var(--accent-1-soft);}
.btn-accent{background:linear-gradient(135deg, var(--accent-2), #c21f7d);border:none;box-shadow:0 6px 24px var(--accent-2-soft);}
.btn-ghost{background:transparent;}
.btn-danger{background:rgba(255,84,112,0.14);border-color:rgba(255,84,112,0.4);color:#ffb3c0;}
.btn-block{width:100%;}
.btn-sm{padding:8px 16px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================= FORMS ============================= */
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.045);border:1px solid var(--glass-border);
  color:var(--text-hi);font-family:var(--font-body);font-size:14.5px;outline:none;
  transition:border-color .18s, background .18s, box-shadow .18s;
}
input::placeholder,textarea::placeholder{color:var(--text-muted);}
input:focus,select:focus,textarea:focus{border-color:var(--accent-1);background:rgba(124,108,255,0.07);box-shadow:0 0 0 3px var(--accent-1-soft);}
.field{margin-bottom:16px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2382849f' stroke-width='1.6' fill='none' fill-rule='evenodd'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}

/* ============================= LAYOUT SHELL ============================= */
#app{position:relative;z-index:1;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--glass-border);
  background:rgba(6,7,17,0.55);backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:18px;box-shadow:0 0 24px var(--accent-1-soft);}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:16.5px;letter-spacing:.03em;}
.brand-name span{color:var(--accent-2);}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-muted);padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;
  color:var(--text-mid);font-size:14px;font-weight:600;transition:background .15s,color .15s;
  position:relative;
}
.nav-item .ic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-hi);}
.nav-item.active{background:linear-gradient(90deg, var(--accent-1-soft), transparent);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));}
.nav-badge{margin-left:auto;background:var(--accent-2);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:var(--font-mono);}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--glass-border);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px 26px;border-bottom:1px solid var(--glass-border);
  background:rgba(6,7,17,0.55);backdrop-filter:blur(20px);
}
.topbar h2{font-size:17px;}
.topbar .spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);cursor:pointer;color:var(--text-mid);transition:.15s;position:relative;}
.icon-btn:hover{color:#fff;border-color:var(--glass-border-hi);}
.dot-alert{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);}
.avatar-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);cursor:pointer;}
.avatar-mini{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent-3),var(--accent-1));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;font-family:var(--font-display);}
.content{padding:26px;flex:1;}
.page{display:none;animation:fadeUp .35s var(--ease);}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* mobile */
.hamburger{display:none;}
@media(max-width:960px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-105%);transition:transform .3s var(--ease);width:240px;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .content{padding:16px;}
  .field-row{grid-template-columns:1fr;}
  .topbar{padding:12px 16px;}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:55;}
.scrim.show{display:block;}

/* ============================= CARDS / GRID ============================= */
.grid{display:grid;gap:18px;}
.grid-cols-3{grid-template-columns:repeat(3,1fr);}
.grid-cols-2{grid-template-columns:repeat(2,1fr);}
.grid-cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.grid-cols-4{grid-template-columns:repeat(2,1fr);}.grid-cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:680px){.grid-cols-4,.grid-cols-3,.grid-cols-2{grid-template-columns:1fr;}}

.card{padding:20px;transition:transform .2s var(--ease), border-color .2s;}
.card:hover{border-color:var(--glass-border-hi);}
.stat-card{padding:18px 20px;}
.stat-card .eyebrow{margin-bottom:8px;}
.stat-value{font-family:var(--font-display);font-size:26px;font-weight:800;}
.stat-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}

.tour-card{overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;}
.tour-banner{height:120px;background:linear-gradient(135deg,rgba(124,108,255,.5),rgba(255,62,165,.4));position:relative;background-size:cover;background-position:center;}
.tour-banner .badge-row{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;}
.tour-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.tour-title{font-family:var(--font-display);font-size:15.5px;font-weight:700;}
.tour-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);}
.tour-meta span{display:flex;align-items:center;gap:5px;}
.prog-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent-3),var(--accent-1));border-radius:6px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-family:var(--font-mono);border:1px solid var(--glass-border);background:rgba(0,0,0,.3);backdrop-filter:blur(6px);}
.badge-live{background:rgba(62,255,192,.16);border-color:rgba(62,255,192,.4);color:var(--accent-3);}
.badge-live .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-3);animation:pulse 1.4s infinite;}
.badge-open{background:rgba(124,108,255,.18);border-color:rgba(124,108,255,.45);color:#c8c1ff;}
.badge-full{background:rgba(255,178,62,.16);border-color:rgba(255,178,62,.4);color:var(--accent-warn);}
.badge-closed,.badge-completed{background:rgba(255,255,255,.06);color:var(--text-muted);}
.badge-cancelled{background:rgba(255,84,112,.14);border-color:rgba(255,84,112,.4);color:#ffb3c0;}
.badge-featured{background:linear-gradient(135deg,var(--accent-2),var(--accent-1));color:#fff;border:none;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(62,255,192,.5);}50%{opacity:.5;box-shadow:0 0 0 5px rgba(62,255,192,0);}}

.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border);width:fit-content;}
.pill-tab{padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:.15s;}
.pill-tab.active{background:var(--glass-hi);color:#fff;box-shadow:inset 0 0 0 1px var(--glass-border-hi);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--glass-border);}
td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.045);color:var(--text-mid);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.list-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;transition:background .15s;}
.list-row:hover{background:rgba(255,255,255,.035);}
.row-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--glass-border);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state .ic{font-size:38px;margin-bottom:10px;opacity:.6;}

.divider{height:1px;background:var(--glass-border);margin:18px 0;}

/* ============================= MODAL ============================= */
.modal-overlay{position:fixed;inset:0;background:rgba(3,4,10,0.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:26px;animation:modalIn .3s var(--ease);}
.modal.modal-lg{max-width:820px;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px;}
.modal-close{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);cursor:pointer;color:var(--text-mid);flex-shrink:0;}
.modal-close:hover{color:#fff;}

/* ============================= TOASTS ============================= */
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px;}
@media(max-width:600px){#toast-wrap{left:16px;right:16px;bottom:16px;max-width:none;}}
.toast{padding:14px 16px;border-radius:14px;display:flex;align-items:flex-start;gap:10px;animation:toastIn .3s var(--ease);font-size:13.5px;}
@keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.toast.ok{border-color:rgba(62,255,192,.4);}
.toast.err{border-color:rgba(255,84,112,.4);}
.toast .ic{flex-shrink:0;margin-top:1px;}

/* ============================= AUTH SCREEN ============================= */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
.auth-box{width:100%;max-width:420px;padding:34px 32px;}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;text-align:center;}
.auth-mark{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:26px;box-shadow:0 0 40px var(--accent-1-soft);}
.auth-title{font-family:var(--font-display);font-weight:800;font-size:22px;}
.otp-row{display:flex;gap:8px;justify-content:space-between;}
.otp-row input{text-align:center;font-family:var(--font-mono);font-size:20px;padding:12px 0;width:46px;}
.auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--text-muted);}
.auth-switch a{color:var(--accent-3);font-weight:600;cursor:pointer;text-decoration:none;}

/* progress ring */
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);}

/* loader */
.loading-screen{position:fixed;inset:0;background:var(--bg-0);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s;}
.loader-ring{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent-1);border-right-color:var(--accent-2);animation:spin .9s linear infinite;}
.skeleton{background:linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:12px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

/* misc */
.flex{display:flex;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;}.gap-10{gap:10px;}.gap-14{gap:14px;}.gap-18{gap:18px;}
.mt-6{margin-top:6px;}.mt-10{margin-top:10px;}.mt-14{margin-top:14px;}.mt-18{margin-top:18px;}.mt-24{margin-top:24px;}
.mb-10{margin-bottom:10px;}.mb-14{margin-bottom:14px;}.mb-18{margin-bottom:18px;}
.text-right{text-align:right;}
.w-full{width:100%;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);font-size:12px;font-weight:600;cursor:pointer;}
.chip.active{background:var(--accent-1-soft);border-color:var(--accent-1);}
.copy-field{display:flex;gap:8px;}
.copy-field input{font-family:var(--font-mono);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.hero-band{padding:30px 30px;margin-bottom:22px;position:relative;overflow:hidden;}
.hero-band::before{content:'';position:absolute;top:-40%;right:-8%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--accent-1-soft),transparent 70%);filter:blur(10px);}
.win-glow{box-shadow:0 0 0 1px rgba(62,255,192,.4), 0 0 30px rgba(62,255,192,.15) !important;}

<body>

<div class="bg-field"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- ======================= APP SHELL ======================= -->

<div class="shell">
  <aside class="sidebar" id="sidebar">

      <div class="avatar-chip" id="avatarChip">
        <div class="avatar-mini" id="avatarMini">?</div>
        <div style="font-size:13px;font-weight:700;" id="chipName">Player</div>
      </div>

    <div class="content" id="content">

</div>
</div>

<!-- ======================= MODAL HOST ======================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="glass modal" id="modalBody"></div>
</div>

<script>
/* ======================================================================
   CLASSYBATTLE — LIQUID GLASS ARENA — SINGLE FILE FRONTEND
   ====================================================================== */
'use strict';

/* ---------------------------- CONFIG / STATE ---------------------------- */
const LS = {
  base: 'cb_api_base', access: 'cb_access', refresh: 'cb_refresh', user: 'cb_user'
};
const FIXED_API_BASE = 'https://classybattle.onrender.com/api/v1';
const state = {
  apiBase: FIXED_API_BASE,
  access: localStorage.getItem(LS.access) || '',
  refresh: localStorage.getItem(LS.refresh) || '',
  user: JSON.parse(localStorage.getItem(LS.user) || 'null'),
  games: [],
  gameModesCache: {},
  gameProfiles: [],
  currentPage: 'dashboard',
  pollers: {},
};

function saveAuth(t){
  state.access = t.access_token; state.refresh = t.refresh_token; state.user = t.user;
  localStorage.setItem(LS.access, state.access);
  localStorage.setItem(LS.refresh, state.refresh);
  localStorage.setItem(LS.user, JSON.stringify(state.user));
}
function clearAuth(){
  state.access=''; state.refresh=''; state.user=null;
  localStorage.removeItem(LS.access); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user);
}

/* ---------------------------- TOASTS ---------------------------- */
function toast(msg, type='ok'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'glass toast ' + type;
  el.innerHTML = `<div class="ic">${type==='ok'?'✓':'⚠'}</div><div>${escapeHtml(msg)}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),320); }, 4200);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------------------- API CLIENT ---------------------------- */
let refreshingPromise = null;
async function api(path, opts={}){
  const url = path.startsWith('http') ? path : state.apiBase.replace(/\/$/,'') + path;
  const headers = Object.assign({}, opts.headers || {});
  let body = opts.body;
  if(body && !(body instanceof FormData)){
    headers['Content-Type'] = 'application/json';
    if(typeof body !== 'string') body = JSON.stringify(body);
  }
  if(state.access && !opts.noAuth) headers['Authorization'] = 'Bearer ' + state.access;
  if(opts.idempotencyKey) headers['Idempotency-Key'] = opts.idempotencyKey;

  let res;
  try{
    res = await fetch(url, { method: opts.method || 'GET', headers, body });
  }catch(e){
    throw new ApiError(0, 'Network error — check API base URL in settings (⚙) and that the backend is reachable.', null);
  }

  if(res.status === 401 && !opts._retried && state.refresh && !opts.noAuth){
    const ok = await tryRefreshToken();
    if(ok) return api(path, Object.assign({}, opts, {_retried:true}));
  }

  if(res.status === 204) return null;
  let data = null;
  const text = await res.text();
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }

  if(!res.ok){
    const msg = (data && (data.message || data.detail || (Array.isArray(data.detail)? data.detail.map(d=>d.msg).join(', '):null))) || `Request failed (${res.status})`;
    throw new ApiError(res.status, msg, data);
  }
  return data;
}
class ApiError extends Error{ constructor(status,message,data){ super(message); this.status=status; this.data=data; } }

async function tryRefreshToken(){
  if(refreshingPromise) return refreshingPromise;
  refreshingPromise = (async()=>{
    try{
      const r = await api('/auth/token/refresh', {method:'POST', body:{refresh_token: state.refresh}, noAuth:true});
      state.access = r.access_token;
      localStorage.setItem(LS.access, state.access);
      return true;
    }catch(e){
      clearAuth(); showAuth('login'); return false;
    }finally{ refreshingPromise = null; }
  })();
  return refreshingPromise;
}

function fmtMoney(v, cur='INR'){
  const n = Number(v||0);
  const sym = cur==='INR' ? '₹' : (cur+' ');
  return sym + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'}); }
function timeAgo(d){
  const s = Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function statusBadgeClass(status){
  const s=(status||'').toLowerCase();
  if(['open','registration_open','active','in_progress','upcoming','scheduled','pending','forming'].includes(s)) return 'badge-open';
  if(['live','ongoing'].includes(s)) return 'badge-live';
  if(['full','locked'].includes(s)) return 'badge-full';
  if(['completed','finished','closed','paid','verified','approved'].includes(s)) return 'badge-completed';
  if(['cancelled','rejected','failed','no_show','disbanded'].includes(s)) return 'badge-cancelled';
  return 'badge-closed';
}

/* ---------------------------- MODAL ---------------------------- */
function openModal(html, opts={}){
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  body.className = 'glass modal' + (opts.large ? ' modal-lg':'');
  body.innerHTML = html;
  overlay.classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modalBody').innerHTML=''; }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ---------------------------- NAV DEFINITION ---------------------------- */
const NAV = [
  {group:'Arena', items:[
    {id:'dashboard', label:'Dashboard', ic:'◈'},
    {id:'tournaments', label:'Tournaments', ic:'🏆'},
    {id:'registrations', label:'My Registrations', ic:'📋'},
    {id:'teams', label:'My Teams', ic:'👥'},
    {id:'matches', label:'Matches', ic:'⚔'},
    {id:'live', label:'Live Now', ic:'📡'},
  ]},
  {group:'Progress', items:[
    {id:'leaderboard', label:'Leaderboard', ic:'📈'},
    {id:'achievements', label:'Achievements', ic:'🎖'},
  ]},
  {group:'Account', items:[
    {id:'wallet', label:'Wallet', ic:'💳'},
    {id:'social', label:'Social', ic:'💬'},
    {id:'notifications', label:'Notifications', ic:'🔔'},
    {id:'profile', label:'Profile', ic:'⚙'},
  ]},
];

function renderNav(){
  const mount = document.getElementById('navMount');
  mount.innerHTML = NAV.map(g => `
    <div class="nav-group-label">${g.group}</div>
    ${g.items.map(it => `
      <div class="nav-item ${state.currentPage===it.id?'active':''}" data-page="${it.id}">
        <div class="ic">${it.ic}</div><div>${it.label}</div>
        ${it.id==='notifications' ? `<div class="nav-badge" id="navUnreadBadge" style="display:none;">0</div>` : ''}
      </div>`).join('')}
  `).join('');
  mount.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ goPage(el.dataset.page); closeSidebarMobile(); });
  });
}
function closeSidebarMobile(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); });
document.getElementById('scrim').addEventListener('click', closeSidebarMobile);

const PAGE_TITLES = {dashboard:'Dashboard', tournaments:'Tournaments', registrations:'My Registrations', teams:'My Teams', matches:'Matches', live:'Live Now', leaderboard:'Leaderboard', achievements:'Achievements', wallet:'Wallet', social:'Social', notifications:'Notifications', profile:'Profile & Settings'};
const PAGE_RENDERERS = {};

function goPage(id){
  state.currentPage = id;
  document.getElementById('pageTitle').textContent = PAGE_TITLES[id] || id;
  renderNav();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  let pageEl = document.getElementById('page-'+id);
  if(!pageEl){
    pageEl = document.createElement('div');
    pageEl.className='page'; pageEl.id='page-'+id;
    document.getElementById('content').appendChild(pageEl);
  }
  pageEl.classList.add('active');
  stopAllPollers();
  if(PAGE_RENDERERS[id]) PAGE_RENDERERS[id](pageEl);
  window.scrollTo({top:0, behavior:'smooth'});
}
function stopAllPollers(){ Object.values(state.pollers).forEach(clearInterval); state.pollers={}; }

/* ---------------------------- BOOT ---------------------------- */
async function boot(){
  renderNav();
  if(state.access && state.user){
    showApp();
    try{ const me = await api('/users/me'); state.user = me; localStorage.setItem(LS.user, JSON.stringify(me)); }catch(e){}
    updateChip();
    goPage('dashboard');
    refreshUnreadBadge();
  }else{
    showAuth('login');
  }
  document.getElementById('bootLoader').style.opacity='0';
  setTimeout(()=>document.getElementById('bootLoader').style.display='none', 400);
}
function showApp(){ document.getElementById('authRoot').style.display='none'; document.getElementById('app').style.display='block'; }
function updateChip(){
  if(!state.user) return;
  document.getElementById('chipName').textContent = state.user.full_name || 'Player';
  document.getElementById('avatarMini').textContent = initials(state.user.full_name);
}
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{ await api('/auth/logout', {method:'POST', body:{refresh_token: state.refresh}}); }catch(e){}
  clearAuth(); stopAllPollers(); document.getElementById('app').style.display='none'; showAuth('login');
});
document.getElementById('avatarChip').addEventListener('click', ()=>goPage('profile'));
document.getElementById('notifBtn').addEventListener('click', ()=>goPage('notifications'));
document.getElementById('settingsBtn').addEventListener('click', openApiSettingsModal);

function openApiSettingsModal(){
  openModal(`
    <div class="modal-head"><h3>API Connection</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="muted" style="font-size:13px;">ClassyBattle backend endpoint. This is locked to the official server.</p>
    <div class="field"><label>API Base URL</label><input value="${escapeHtml(state.apiBase)}" readonly disabled style="opacity:.6;cursor:not-allowed;"></div>
    <div class="glass-soft" style="padding:12px;font-size:12.5px;" class="muted">🔒 Locked — cannot be changed.</div>
  `);
}

/* ======================================================================
   AUTH SCREENS
   ====================================================================== */
function showAuth(mode, ctx={}){
  document.getElementById('authRoot').style.display='flex';
  document.getElementById('app').style.display='none';
  const box = document.getElementById('authBox');
  if(mode==='login') box.innerHTML = tplLogin();
  if(mode==='signup') box.innerHTML = tplSignup();
  if(mode==='verify') box.innerHTML = tplVerifyOtp(ctx);
  if(mode==='forgot') box.innerHTML = tplForgot();
  if(mode==='resetotp') box.innerHTML = tplResetOtp(ctx);
  if(mode==='resetpass') box.innerHTML = tplResetPass(ctx);
  wireAuthForm(mode);
}
function tplLogin(){
  return `
  <div class="auth-logo"><div class="auth-mark">CB</div><div class="auth-title">Welcome back</div><div class="muted" style="font-size:13px;">Sign in to enter the arena</div></div>
  <form id="authForm">
    <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required placeholder="••••••••"></div>
    <div class="text-right mt-6 mb-14" style="font-size:12.5px;"><a onclick="showAuth('forgot')" style="color:var(--accent-3);cursor:pointer;">Forgot password?</a></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Log in</span></button>
  </form>
  <div class="auth-switch">New here? <a onclick="showAuth('signup')">Create an account</a></div>`;
}
function tplSignup(){
  return `
  <div class="auth-logo"><div class="auth-mark">CB</div><div class="auth-title">Join the roster</div><div class="muted" style="font-size:13px;">Create your ClassyBattle account</div></div>
  <form id="authForm">
    <div class="field"><label>Full name</label><input name="full_name" required placeholder="Your name"></div>
    <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div>
    <div class="field"><label>Phone number</label><input name="phone_number" required placeholder="10-digit number"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required placeholder="Strong password"></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Create account</span></button>
  </form>
  <div class="auth-switch">Already registered? <a onclick="showAuth('login')">Log in</a></div>`;
}
function tplVerifyOtp(ctx){
  return `
  <div class="auth-logo"><div class="auth-mark">✉</div><div class="auth-title">Verify your email</div><div class="muted" style="font-size:13px;">We sent a code to <b>${escapeHtml(ctx.email||'')}</b></div></div>
  <form id="authForm">
    <input type="hidden" name="email" value="${escapeHtml(ctx.email||'')}">
    <div class="field"><label>Enter OTP</label><input name="otp" required placeholder="6-digit code" style="text-align:center;letter-spacing:.5em;font-family:var(--font-mono);font-size:20px;"></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Verify & continue</span></button>
  </form>
  <div class="auth-switch"><a onclick="resendOtp('${escapeHtml(ctx.email||'')}','signup_verification')">Resend code</a></div>`;
}
function tplForgot(){
  return `
  <div class="auth-logo"><div class="auth-mark">🔑</div><div class="auth-title">Reset password</div><div class="muted" style="font-size:13px;">We'll email you a reset code</div></div>
  <form id="authForm">
    <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Send reset code</span></button>
  </form>
  <div class="auth-switch"><a onclick="showAuth('login')">Back to log in</a></div>`;
}
function tplResetOtp(ctx){
  return `
  <div class="auth-logo"><div class="auth-mark">✉</div><div class="auth-title">Enter reset code</div><div class="muted" style="font-size:13px;">Sent to <b>${escapeHtml(ctx.email||'')}</b></div></div>
  <form id="authForm">
    <input type="hidden" name="email" value="${escapeHtml(ctx.email||'')}">
    <div class="field"><label>OTP</label><input name="otp" required placeholder="6-digit code" style="text-align:center;letter-spacing:.5em;font-family:var(--font-mono);font-size:20px;"></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Verify code</span></button>
  </form>
  <div class="auth-switch"><a onclick="resendOtp('${escapeHtml(ctx.email||'')}','password_reset')">Resend code</a></div>`;
}
function tplResetPass(ctx){
  return `
  <div class="auth-logo"><div class="auth-mark">🔒</div><div class="auth-title">New password</div></div>
  <form id="authForm">
    <input type="hidden" name="email" value="${escapeHtml(ctx.email||'')}">
    <input type="hidden" name="otp" value="${escapeHtml(ctx.otp||'')}">
    <div class="field"><label>New password</label><input type="password" name="new_password" required placeholder="Strong password"></div>
    <button class="btn btn-primary btn-block" type="submit"><span class="btn-label">Update password</span></button>
  </form>
  <div class="auth-switch"><a onclick="showAuth('login')">Back to log in</a></div>`;
}
async function resendOtp(email, purpose){
  try{ await api('/auth/otp/resend', {method:'POST', body:{email, purpose}, noAuth:true}); toast('OTP resent — check your email'); }
  catch(e){ toast(e.message,'err'); }
}
function wireAuthForm(mode){
  const form = document.getElementById('authForm');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const btn = form.querySelector('button[type=submit]');
    const label = btn.querySelector('.btn-label').textContent;
    btn.disabled = true; btn.querySelector('.btn-label').innerHTML = '<span class="spin"></span>';
    try{
      if(mode==='login'){
        const t = await api('/auth/login', {method:'POST', body:data, noAuth:true});
        saveAuth(t); toast('Welcome back, '+t.user.full_name+'!'); showApp(); updateChip(); goPage('dashboard'); refreshUnreadBadge();
      } else if(mode==='signup'){
        const r = await api('/auth/signup', {method:'POST', body:data, noAuth:true});
        toast(r.message||'OTP sent to your email'); showAuth('verify', {email:data.email});
      } else if(mode==='verify'){
        const t = await api('/auth/signup/verify-otp', {method:'POST', body:data, noAuth:true});
        saveAuth(t); toast('Account verified — welcome!'); showApp(); updateChip(); goPage('dashboard'); refreshUnreadBadge();
      } else if(mode==='forgot'){
        await api('/auth/password/forgot', {method:'POST', body:data, noAuth:true});
        toast('Reset code sent'); showAuth('resetotp', {email:data.email});
      } else if(mode==='resetotp'){
        await api('/auth/password/verify-otp', {method:'POST', body:data, noAuth:true});
        toast('Code verified'); showAuth('resetpass', {email:data.email, otp:data.otp});
      } else if(mode==='resetpass'){
        await api('/auth/password/reset', {method:'POST', body:data, noAuth:true});
        toast('Password updated — please log in'); showAuth('login');
      }
    }catch(err){ toast(err.message,'err'); }
    finally{ btn.disabled=false; btn.querySelector('.btn-label').textContent = label; }
  });
}

/* ======================================================================
   SHARED DATA HELPERS
   ====================================================================== */
async function ensureGames(){
  if(state.games.length) return state.games;
  try{ state.games = await api('/games'); }catch(e){ state.games=[]; }
  return state.games;
}
async function ensureGameProfiles(){
  try{ state.gameProfiles = await api('/games/profiles/me'); }catch(e){ state.gameProfiles=[]; }
  return state.gameProfiles;
}
function gameName(id){ const g = state.games.find(x=>x.id===id); return g? g.name : '—'; }

/* ======================================================================
   PAGE: DASHBOARD
   ====================================================================== */
PAGE_RENDERERS.dashboard = async function(el){
  el.innerHTML = `
    <div class="glass hero-band">
      <div class="eyebrow">PLAYER HQ</div>
      <h1 style="font-size:26px;margin-top:8px;">Ready to compete, ${escapeHtml((state.user&&state.user.full_name)||'Player')}?</h1>
      <p style="max-width:560px;margin-top:8px;">Track your wallet, live matches and tournament registrations from one command center.</p>
      <div class="flex gap-10 mt-18">
        <button class="btn btn-primary" onclick="goPage('tournaments')">Browse tournaments</button>
        <button class="btn btn-ghost" onclick="goPage('live')">Watch live</button>
      </div>
    </div>
    <div class="grid grid-cols-4 mb-18" id="dashStats">
      ${Array(4).fill('<div class="glass stat-card skeleton" style="height:86px;"></div>').join('')}
    </div>
    <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:18px;" id="dashLower">
      <div class="glass card"><div class="skeleton" style="height:220px;"></div></div>
      <div class="glass card"><div class="skeleton" style="height:220px;"></div></div>
    </div>
  `;
  try{
    const [wallet, stats, notifs, tours] = await Promise.allSettled([
      api('/wallet'), api('/players/'+state.user.id+'/statistics'), api('/notifications?page=1&page_size=5'), api('/tournaments?page=1&page_size=4&status=scheduled')
    ]);
    const w = wallet.status==='fulfilled'? wallet.value : null;
    const s = stats.status==='fulfilled'? stats.value : null;
    document.getElementById('dashStats').innerHTML = `
      <div class="glass stat-card"><div class="eyebrow">Wallet balance</div><div class="stat-value">${w?fmtMoney(w.total_balance,w.currency):'—'}</div><div class="stat-sub">${w?fmtMoney(w.locked_balance,w.currency)+' locked':'Connect wallet'}</div></div>
      <div class="glass stat-card"><div class="eyebrow">Matches played</div><div class="stat-value">${s?s.matches_played:'—'}</div><div class="stat-sub">${s? (s.win_rate*100).toFixed(1)+'% win rate':'No data yet'}</div></div>
      <div class="glass stat-card"><div class="eyebrow">K/D ratio</div><div class="stat-value">${s? s.kd_ratio.toFixed(2):'—'}</div><div class="stat-sub">${s? s.kills+' kills · '+s.mvp_count+' MVPs':'—'}</div></div>
      <div class="glass stat-card"><div class="eyebrow">Prize earned</div><div class="stat-value">${s?fmtMoney(s.prize_money_earned):'—'}</div><div class="stat-sub">${s? s.tournaments_won+' tournaments won':'—'}</div></div>
    `;
    const tourList = tours.status==='fulfilled' ? tours.value.items : [];

let tourState = {page:1, status:'', search:'', pages:1};
PAGE_RENDERERS.tournaments = async function(el){
  await ensureGames();
  el.innerHTML = `
    <div class="section-title">
      <div class="pill-tabs" id="tourStatusTabs">
        ${['','scheduled','live','completed','cancelled'].map(s=>`<div class="pill-tab ${tourState.status===s?'active':''}" data-s="${s}">${s? s.replace('_',' '):'All'}</div>`).join('')}
      </div>
      <div class="flex gap-8">
        <input id="tourSearch" placeholder="Search tournaments…" style="width:220px;" value="${escapeHtml(tourState.search)}">
      </div>
    </div>
    <div id="tourGrid">${Array(3).fill('<div class="glass card mb-18"><div class="skeleton" style="height:160px;"></div></div>').join('')}</div>
    <div class="flex items-center justify-between mt-18" id="tourPager"></div>
  `;
  el.querySelectorAll('#tourStatusTabs .pill-tab').forEach(t=>t.addEventListener('click', ()=>{ tourState.status=t.dataset.s; tourState.page=1; loadTournaments(); }));
  let debounce;
  document.getElementById('tourSearch').addEventListener('input', (e)=>{ clearTimeout(debounce); debounce=setTimeout(()=>{ tourState.search=e.target.value; tourState.page=1; loadTournaments(); },380); });
  loadTournaments();
};
async function loadTournaments(){
  const grid = document.getElementById('tourGrid'); if(!grid) return;
  try{
    let q = `/tournaments?page=${tourState.page}&page_size=9`;
    if(tourState.status) q += `&status=${tourState.status}`;
    if(tourState.search) q += `&search=${encodeURIComponent(tourState.search)}`;
    const r = await api(q);
    tourState.pages = r.total_pages;
    if(!r.items.length){ grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🏆</div>No tournaments found</div>`; }
    else{
      grid.innerHTML = r.items.map(t=>`
        <div class="glass card mb-18" style="grid-column:1/-1;">
          <div class="flex justify-between items-center flex-wrap gap-10 mb-14">
            <div>
              <div class="flex gap-8 items-center">
                <span class="badge ${statusBadgeClass(t.status)}">${t.status.replace('_',' ')}</span>
                ${t.is_featured? '<span class="badge badge-featured">★ Featured</span>':''}
              </div>
              <div class="tour-title mt-6">${escapeHtml(t.title)}</div>
              <div class="tour-meta">
                <span>🎮 ${escapeHtml(gameName(t.game_id))}</span>
                <span>👥 ${t.registration_mode}</span>
                <span>${t.current_players}/${t.max_players} players</span>
              </div>
            </div>
            <div class="flex gap-14 items-center">
              <div style="text-align:right;">
                <div style="font-family:var(--font-display);font-weight:800;color:var(--accent-3);">${fmtMoney(t.prize_pool)}</div>
                <div class="muted" style="font-size:12px;">Entry ${fmtMoney(t.entry_fee)}</div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="openTournamentDetail('${t.id}')">Details</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    document.getElementById('tourPager').innerHTML = pagerHtml(tourState.page, tourState.pages, 'tourPage');
  }catch(e){ grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">⚠ ${escapeHtml(e.message)}</div>`; }
}
function pagerHtml(page,total,fnName){
  if(total<=1) return '';
  return `
  <button class="btn btn-sm" ${page<=1?'disabled':''} onclick="${fnName}(${page-1})">← Prev</button>
  <span class="muted mono" style="font-size:12.5px;">Page ${page} / ${total}</span>
  <button class="btn btn-sm" ${page>=total?'disabled':''} onclick="${fnName}(${page+1})">Next →</button>`;
}
function tourPage(p){ tourState.page=p; loadTournaments(); }

/* A Tournament IS the match now (no separate Match resource) — room
   credentials live directly on the tournament and are only visible to
   registered participants/admins once the admin publishes them. */
async function renderTournamentRoom(t, target){
  if(!target) return;
  target.innerHTML = `<div class="skeleton" style="height:80px;"></div>`;
  try{
    const room = await api('/tournaments/'+t.id+'/room');
    target.innerHTML = `
      <div class="eyebrow mb-10">Room details</div>
      ${room && room.room_id ? `
        <div class="grid grid-cols-2 mb-14">
          <div class="glass-soft" style="padding:14px;"><div class="muted" style="font-size:11px;">Room ID</div><div class="mono" style="font-weight:700;">${escapeHtml(room.room_id||'—')}</div></div>
          <div class="glass-soft" style="padding:14px;"><div class="muted" style="font-size:11px;">Password</div><div class="mono" style="font-weight:700;">${escapeHtml(room.room_password||'—')}</div></div>
        </div>
        ${room.published_at? `<div class="muted" style="font-size:11.5px;">Published ${timeAgo(room.published_at)}</div>`:''}
      ` : `<div class="glass-soft muted" style="padding:14px;">Room details not published yet — check back closer to match time.</div>`}
    `;
  }catch(e){
    target.innerHTML = `<div class="eyebrow mb-10">Room details</div><div class="glass-soft muted" style="padding:14px;">Room details aren't visible to you yet — you may need to join this tournament first.</div>`;
  }

function renderRegAction(t, myReg, isTeam){
  const box = document.getElementById('regAction'); if(!box) return;
  if(myReg && myReg.status !== 'cancelled'){
    box.innerHTML = `
      <div class="glass-soft" style="padding:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div><div style="font-weight:700;">You're registered</div><div class="muted" style="font-size:12.5px;">Status: ${myReg.status} · Payment: ${myReg.payment_status}${myReg.team_name?' · Team: '+escapeHtml(myReg.team_name):''}</div></div>
        ${t.status==='scheduled' ? `<button class="btn btn-danger btn-sm" onclick="cancelRegistration('${t.id}')">Cancel registration</button>` : ''}
      </div>`;
    return;
  }
  if(t.status !== 'scheduled'){
    box.innerHTML = `<div class="glass-soft" style="padding:16px;text-align:center;" class="muted">Registration is not open for this tournament.</div>`;
    return;
  }
  if(isTeam){
    box.innerHTML = `

          <button class="btn btn-primary btn-sm" onclick="openCreateTeam('${t.id}','${t.game_id}')">Create a team — ${fmtMoney(t.entry_fee)} entry</button>

      </div>`;

  box.innerHTML = `
    <button class="btn btn-primary btn-block" onclick="startRegistration('${t.id}')">
      Register now — ${fmtMoney(t.entry_fee)} entry
    </button>`;
}
async function cancelRegistration(tid){
  if(!confirm('Cancel your registration for this tournament?')) return;
  try{ await api('/tournaments/'+tid+'/cancel', {method:'POST'}); toast('Registration cancelled'); openTournamentDetail(tid); }
  catch(e){ toast(e.message,'err'); }
}
async function startRegistration(tid){
  await ensureGameProfiles();
  const t = await api('/tournaments/'+tid);
  const opts = state.gameProfiles.filter(p=>p.game_id===t.game_id);
  const box = document.getElementById('regAction');
  if(!opts.length){
    box.innerHTML = `<div class="glass-soft" style="padding:16px;">You need a game profile for <b>${escapeHtml(gameName(t.game_id))}</b> before registering. <a style="color:var(--accent-3);cursor:pointer;" onclick="goPage('profile')">Add one in Profile →</a></div>`;
    return;
  }
  box.innerHTML = `

      <div class="field"><label>Game profile</label>
        <select id="regProfileSel">${opts.map(o=>`<option value="${o.id}">${escapeHtml(o.ign||o.player_id||o.id)}</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary btn-block" onclick="submitRegistration('${tid}')">Confirm registration — ${fmtMoney(t.entry_fee)}</button>

}
async function submitRegistration(tid){
  const profileId = document.getElementById('regProfileSel').value;
  try{
    const payload = {game_profile_id: profileId, registration_type: 'solo'};
    await api('/tournaments/'+tid+'/register', {method:'POST', body:payload, idempotencyKey:'reg-'+tid+'-'+Date.now()});
    toast('Registered successfully!'); openTournamentDetail(tid);
  }catch(e){ toast(e.message,'err'); }
}

async function loadWalletTab(tab){
  const body = document.getElementById('walletBody'); if(!body) return;
  body.innerHTML = `<div class="skeleton" style="height:260px;"></div>`;
  try{
    if(tab==='tx'){
      const r = await api('/wallet/transactions?page=1&page_size=30');

      </tbody></table></div>` : emptyWallet('No transactions yet');
    } else if(tab==='dep'){
      const r = await api('/payments/deposits?page=1&page_size=30');

      </tbody></table></div>` : emptyWallet('No deposit requests yet');
    } else if(tab==='wd'){
      const r = await api('/withdrawals?page=1&page_size=30');
      body.innerHTML = r.items.length ? `<div class="table-wrap"><table><thead><tr><th>Amount</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>
        ${r.items.map(d=>`<tr><td>${fmtMoney(d.amount)}</td><td><span class="badge ${statusBadgeClass(d.status)}">${d.status}</span></td><td class="muted">${fmtDateShort(d.created_at)}</td><td>${d.status==='pending'?`<button class="btn btn-sm btn-danger" onclick="cancelWithdrawal('${d.id}')">Cancel</button>`:''}</td></tr>`).join('')}

}
function emptyWallet(msg){ return `<div class="empty-state"><div class="ic">💳</div>${msg}</div>`; }
async function cancelDeposit(id){ try{ await api('/payments/deposits/'+id+'/cancel',{method:'POST'}); toast('Deposit cancelled'); loadWalletTab('dep'); }catch(e){ toast(e.message,'err'); } }
async function cancelWithdrawal(id){ try{ await api('/withdrawals/'+id+'/cancel',{method:'POST'}); toast('Withdrawal cancelled'); loadWalletTab('wd'); }catch(e){ toast(e.message,'err'); } }

let depQrGenerated = false;
async function openDepositModal(){
  depQrGenerated = false;
  openModal(`
    <div class="modal-head"><h3>Add funds</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Amount (₹)</label><input id="depAmount" type="number" min="1" step="0.01" placeholder="500.00"></div>
    <button class="btn btn-primary btn-block" onclick="getDepositQr()">Get deposit QR</button>
    <div id="depQrResult" class="mt-14"></div>
  `);
}
async function getDepositQr(){
  const amount = parseFloat(document.getElementById('depAmount').value);
  if(!amount || amount<=0) return toast('Enter a valid amount','err');
  try{
    const qr = await api('/payments/deposit/qr', {method:'POST', body:{amount}});
    depQrGenerated = true;
    document.getElementById('depQrResult').innerHTML = `
      <div class="glass-soft" style="padding:14px;text-align:center;margin-bottom:14px;">
        <div class="mono" style="font-size:13px;font-weight:700;">${escapeHtml(qr.upi_id)}</div>
        <div class="muted" style="font-size:11.5px;margin-top:4px;">Pay ${fmtMoney(qr.amount, qr.currency)} to ${escapeHtml(qr.merchant_name)} via UPI, then fill in the details below.</div>
      </div>
      <div class="field"><label>UTR / Transaction reference number</label><input id="depUtr" placeholder="e.g. 123456789012"></div>
      <div class="field"><label>Payment screenshot</label><input id="depScreenshot" type="file" accept="image/jpeg,image/png,image/webp"></div>
      <button class="btn btn-primary btn-block" onclick="submitDeposit(${amount})">Submit deposit request</button>
    `;
  }catch(e){ toast(e.message,'err'); }
}
async function submitDeposit(amount){
  const utr = document.getElementById('depUtr').value.trim();
  const fileInput = document.getElementById('depScreenshot');
  const file = fileInput.files[0];
  if(!utr) return toast('Enter the UTR / transaction reference number','err');
  if(!file) return toast('Upload a payment screenshot','err');
  try{
    const fd = new FormData();
    fd.append('screenshot', file);
    const qs = `amount=${encodeURIComponent(amount)}&utr_number=${encodeURIComponent(utr)}`;
    await api('/payments/deposit?'+qs, {method:'POST', body:fd, idempotencyKey:'dep-'+Date.now()});
    toast('Deposit request submitted — awaiting confirmation'); closeModal(); loadWalletTab('dep');
  }catch(e){ toast(e.message,'err'); }
}
async function openWithdrawModal(){
  openModal(`<div class="skeleton" style="height:200px;"></div>`);
  try{
    const methods = await api('/payment-methods');
    if(!methods.length){
      openModal(`
        <div class="modal-head"><h3>Withdraw funds</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="empty-state">Add a payment method first before requesting a withdrawal.</div>
        <button class="btn btn-primary btn-block mt-10" onclick="openPaymentMethods()">Add payment method</button>
      `);
      return;
    }
    openModal(`
      <div class="modal-head"><h3>Withdraw funds</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="field"><label>Payment method</label>
        <select id="wdMethod">${methods.map(m=>`<option value="${m.id}">${escapeHtml(paymentMethodLabel(m))}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Amount (₹)</label><input id="wdAmount" type="number" min="1" step="0.01" placeholder="500.00"></div>
      <button class="btn btn-primary btn-block" onclick="submitWithdraw()">Request withdrawal</button>
    `);
  }catch(e){ toast(e.message,'err'); }
}
async function submitWithdraw(){
  const amount = parseFloat(document.getElementById('wdAmount').value);
  const payment_method_id = document.getElementById('wdMethod').value;
  if(!amount || amount<=0) return toast('Enter a valid amount','err');
  try{ await api('/withdrawals', {method:'POST', body:{amount, payment_method_id}, idempotencyKey:'wd-'+Date.now()}); toast('Withdrawal requested'); closeModal(); loadWalletTab('wd'); }
  catch(e){ toast(e.message,'err'); }
}
function paymentMethodLabel(m){
  return m.method_type==='upi' ? `${m.account_holder_name} — ${m.upi_id}` : `${m.account_holder_name} — ${m.account_number} (${m.ifsc_code})`;
}
async function openPaymentMethods(){
  openModal(`<div class="skeleton" style="height:200px;"></div>`);
  try{
    const methods = await api('/payment-methods');
    openModal(`
      <div class="modal-head"><h3>Payment methods</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      ${methods.length? methods.map(m=>`<div class="list-row"><div class="row-icon">💳</div><div style="flex:1;">${escapeHtml(paymentMethodLabel(m))}</div><button class="btn btn-sm btn-danger" onclick="deletePaymentMethod('${m.id}')">Remove</button></div>`).join(''):'<div class="empty-state">No payment methods saved</div>'}
      <div class="divider"></div>
      <div class="field"><label>Method type</label>
        <select id="pmType" onchange="togglePmFields()">
          <option value="upi">UPI</option>
          <option value="bank">Bank account</option>
        </select>
      </div>
      <div class="field"><label>Account holder name</label><input id="pmName" placeholder="Full name on the account"></div>
      <div id="pmUpiField" class="field"><label>UPI ID</label><input id="pmUpi" placeholder="yourname@upi"></div>
      <div id="pmBankFields" style="display:none;">
        <div class="field"><label>Account number</label><input id="pmAccNum" placeholder="Account number"></div>
        <div class="field"><label>IFSC code</label><input id="pmIfsc" placeholder="e.g. SBIN0001234" style="text-transform:uppercase;"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="addPaymentMethod()">Add method</button>
    `);
  }catch(e){ toast(e.message,'err'); }
}
function togglePmFields(){
  const isUpi = document.getElementById('pmType').value === 'upi';
  document.getElementById('pmUpiField').style.display = isUpi ? '' : 'none';
  document.getElementById('pmBankFields').style.display = isUpi ? 'none' : '';
}
async function addPaymentMethod(){
  const method_type = document.getElementById('pmType').value;
  const account_holder_name = document.getElementById('pmName').value.trim();
  if(!account_holder_name) return toast('Enter the account holder name','err');
  const body = { method_type, account_holder_name };
  if(method_type === 'upi'){
    const upi_id = document.getElementById('pmUpi').value.trim();
    if(!upi_id) return toast('Enter a UPI ID','err');
    body.upi_id = upi_id;
  } else {
    const account_number = document.getElementById('pmAccNum').value.trim();
    const ifsc_code = document.getElementById('pmIfsc').value.trim().toUpperCase();
    if(!account_number || !ifsc_code) return toast('Enter account number and IFSC code','err');
    body.account_number = account_number; body.ifsc_code = ifsc_code;
  }
  try{ await api('/payment-methods', {method:'POST', body}); toast('Payment method added'); openPaymentMethods(); }
  catch(e){ toast(e.message,'err'); }
}
async function deletePaymentMethod(id){
  try{ await api('/payment-methods/'+id, {method:'DELETE'}); toast('Removed'); openPaymentMethods(); }
  catch(e){ toast(e.message,'err'); }
}

        const uid = f.requester? f.requester.player_uid : '';
        const reqUserId = f.requester_id;
        return `<div class="list-row"><div class="avatar-mini" style="border-radius:12px;cursor:pointer;" onclick="viewPlayerProfile('${reqUserId}')">${initials(name)}</div><div style="flex:1;cursor:pointer;" onclick="viewPlayerProfile('${reqUserId}')"><div>${escapeHtml(name)}</div>${uid?`<div class="muted mono" style="font-size:11px;">${escapeHtml(uid)}</div>`:''}</div><div class="flex gap-8"><button class="btn btn-sm btn-primary" onclick="respondFriend('${f.id}',true)">Accept</button><button class="btn btn-sm btn-ghost" onclick="respondFriend('${f.id}',false)">Decline</button></div></div>`;
      }).join('') : `<div class="empty-state"><div class="ic">📭</div>No pending requests</div>`;
    } else if(socialTab==='search'){
      body.innerHTML = `<div class="field"><input id="socSearchInput" placeholder="Search players by name or UID…"></div><div id="socSearchResults"></div>`;
      let deb; document.getElementById('socSearchInput').addEventListener('input', e=>{ clearTimeout(deb); deb=setTimeout(()=>doSocialSearch(e.target.value),380); });
    } else if(socialTab==='feed'){
      const r = await api('/social/feed?page=1&page_size=30');
      body.innerHTML = r.items.length? r.items.map(a=>`<div class="list-row"><div class="row-icon">📣</div><div style="flex:1;"><div style="font-size:13px;">${escapeHtml(a.description||a.activity_type||'Activity')}</div><div class="muted" style="font-size:11px;">${timeAgo(a.created_at)}</div></div></div>`).join('') : `<div class="empty-state"><div class="ic">📣</div>No activity yet</div>`;
    }
  }catch(e){ body.innerHTML = `<div class="empty-state">⚠ ${escapeHtml(e.message)}</div>`; }
};
async function doSocialSearch(q){
  const out = document.getElementById('socSearchResults'); if(!out) return;
  if(!q || q.length<2){ out.innerHTML=''; return; }
  try{
    const r = await api('/social/search?q='+encodeURIComponent(q)+'&page=1&page_size=20');
    out.innerHTML = r.items.length? r.items.map(p=>{
      const name = p.user? p.user.full_name : (p.display_name||'Player');
      const uid = p.user? p.user.player_uid : '';
      const targetUserId = p.user_id || (p.user? p.user.id : null);
      const rel = p.relationship_status;
      const actionBtn = rel==='friend' ? `<span class="muted" style="font-size:12px;">Friends</span>`
        : rel==='pending' ? `<span class="muted" style="font-size:12px;">Pending</span>`
        : `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();sendFriendReq('${targetUserId}')">Add friend</button>`;
      return `<div class="list-row" style="cursor:pointer;" onclick="viewPlayerProfile('${targetUserId}')"><div class="avatar-mini" style="border-radius:12px;">${initials(name)}</div><div style="flex:1;"><div>${escapeHtml(name)}</div>${uid?`<div class="muted mono" style="font-size:11px;">${escapeHtml(uid)}</div>`:''}</div>${actionBtn}</div>`;
    }).join('') : `<div class="empty-state">No players found</div>`;
  }catch(e){ out.innerHTML = `<div class="empty-state">⚠ ${escapeHtml(e.message)}</div>`; }
}

async function viewPlayerProfile(userId){
  if(!userId) return;
  openModal(`<div class="modal-head"><h3>Player profile</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="skeleton" style="height:200px;"></div>`);
  try{
    const p = await api('/social/profiles/'+userId);
    const name = p.user? p.user.full_name : (p.display_name||'Player');
    const uid = p.user? p.user.player_uid : '';
    const rel = p.relationship_status;
    const relBadge = rel==='self' ? '' : rel==='friend' ? `<span class="muted" style="font-size:12px;">✓ Friends</span>`
      : rel==='pending' ? `<span class="muted" style="font-size:12px;">Request pending</span>`
      : rel==='blocked' ? `<span class="muted" style="font-size:12px;">Blocked</span>`
      : `<button class="btn btn-sm btn-primary" onclick="sendFriendReq('${userId}')">Add friend</button>`;
    openModal(`
      <div class="modal-head"><h3>${escapeHtml(name)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div class="avatar-mini" style="width:56px;height:56px;font-size:20px;border-radius:16px;">${initials(name)}</div>
        <div>
          <div style="font-weight:700;font-size:16px;">${escapeHtml(name)}</div>
          ${uid?`<div class="muted mono" style="font-size:12px;">${escapeHtml(uid)}</div>`:''}
        </div>
      </div>
      ${p.bio? `<p style="margin-bottom:14px;">${escapeHtml(p.bio)}</p>` : ''}
      <div class="flex gap-16" style="margin-bottom:16px;">
        <div><div style="font-weight:700;">${p.friends_count??0}</div><div class="muted" style="font-size:11px;">Friends</div></div>
        <div><div style="font-weight:700;">${p.followers_count??0}</div><div class="muted" style="font-size:11px;">Followers</div></div>
        <div><div style="font-weight:700;">${p.following_count??0}</div><div class="muted" style="font-size:11px;">Following</div></div>
      </div>
      <div>${relBadge}</div>
    `);
  }catch(e){
    openModal(`<div class="modal-head"><h3>Error</h3><button class="modal-close" onclick="closeModal()">✕</button></div><p>⚠ ${escapeHtml(e.message)}</p>`);
  }
}
async function sendFriendReq(userId){ try{ await api('/social/friends/requests',{method:'POST', body:{addressee_id:userId}}); toast('Friend request sent'); }catch(e){ toast(e.message,'err'); } }
async function respondFriend(id,accept){ try{ await api('/social/friends/requests/'+id+'/'+(accept?'accept':'reject'),{method:'POST'}); toast(accept?'Friend added':'Request declined'); goPage('social'); }catch(e){ toast(e.message,'err'); } }
async function removeFriend(userId){ if(!confirm('Remove this friend?'))return; try{ await api('/social/friends/'+userId,{method:'DELETE'}); toast('Removed'); goPage('social'); }catch(e){ toast(e.message,'err'); } }

/* ======================================================================
   PAGE: NOTIFICATIONS
   ====================================================================== */
PAGE_RENDERERS.notifications = async function(el){
  el.innerHTML = `
    <div class="section-title">
      <div></div>
      <div class="flex gap-8">
        <button class="btn btn-sm btn-ghost" onclick="markAllRead()">Mark all read</button>
        <button class="btn btn-sm btn-ghost" onclick="openNotifPrefs()">Preferences</button>
      </div>
    </div>
    <div class="glass card" id="notifList"><div class="skeleton" style="height:300px;"></div></div>`;
  await loadNotifList();
};
async function loadNotifList(){
  const el = document.getElementById('notifList'); if(!el) return;
  try{
    const r = await api('/notifications?page=1&page_size=40');
    el.innerHTML = r.items.length? r.items.map(n=>`
      <div class="list-row" style="cursor:pointer;${!n.is_read?'background:rgba(124,108,255,.05);':''}" onclick="openNotif('${n.id}', ${!n.is_read})">
        <div class="row-icon">${n.is_read?'📭':'📬'}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:13.5px;">${escapeHtml(n.title)}</div>
          <div class="muted" style="font-size:12px;">${escapeHtml(n.body||'')}</div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${timeAgo(n.created_at)}</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();deleteNotif('${n.id}')">✕</button>
      </div>`).join('') : `<div class="empty-state"><div class="ic">🔔</div>No notifications</div>`;
    refreshUnreadBadge();
  }catch(e){ el.innerHTML = `<div class="empty-state">⚠ ${escapeHtml(e.message)}</div>`; }
}
async function openNotif(id, wasUnread){
  if(wasUnread){ try{ await api('/notifications/'+id+'/read', {method:'PATCH'}); }catch(e){} loadNotifList(); }
}
async function deleteNotif(id){ try{ await api('/notifications/'+id, {method:'DELETE'}); toast('Deleted'); loadNotifList(); }catch(e){ toast(e.message,'err'); } }
async function markAllRead(){ try{ await api('/notifications/read-all',{method:'PATCH'}); toast('All marked as read'); loadNotifList(); }catch(e){ toast(e.message,'err'); } }
async function refreshUnreadBadge(){
  try{
    const r = await api('/notifications/unread-count');
    const dot = document.getElementById('notifDot');
    const navB = document.getElementById('navUnreadBadge');
    if(r.unread_count>0){ dot.style.display='block'; if(navB){navB.style.display='block'; navB.textContent=r.unread_count;} }
    else{ dot.style.display='none'; if(navB) navB.style.display='none'; }
  }catch(e){}
}
async function openNotifPrefs(){
  openModal(`<div class="skeleton" style="height:200px;"></div>`);
  try{
    const p = await api('/notifications/preferences');
    openModal(`
      <div class="modal-head"><h3>Notification preferences</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="list-row"><div style="flex:1;">In-app notifications</div><input type="checkbox" id="prefInApp" ${p.in_app_enabled?'checked':''}></div>
      <div class="list-row"><div style="flex:1;">Push notifications</div><input type="checkbox" id="prefPush" ${p.push_enabled?'checked':''}></div>
      <button class="btn btn-primary btn-block mt-14" onclick="saveNotifPrefs()">Save preferences</button>
    `);
  }catch(e){ toast(e.message,'err'); }
}
async function saveNotifPrefs(){
  const body = {in_app_enabled: document.getElementById('prefInApp').checked, push_enabled: document.getElementById('prefPush').checked};
  try{ await api('/notifications/preferences', {method:'PUT', body}); toast('Preferences saved'); closeModal(); }
  catch(e){ toast(e.message,'err'); }
}

/* ======================================================================
   PAGE: PROFILE
   ====================================================================== */
const AVATARS = ['avatar_1','avatar_2','avatar_3','avatar_4','avatar_5','avatar_6'];
PAGE_RENDERERS.profile = async function(el){
  el.innerHTML = `<div class="glass card"><div class="skeleton" style="height:400px;"></div></div>`;
  try{
    const u = await api('/users/me');
    await ensureGames(); await ensureGameProfiles();
    el.innerHTML = `
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:18px;">
        <div class="glass card">
          <h3 class="mb-18" style="font-size:15px;">Edit profile</h3>
          <div class="flex gap-14 mb-18">
            <div class="avatar-mini" id="profAvatarPreview" style="width:56px;height:56px;font-size:20px;">${initials(u.full_name)}</div>
            <div style="flex:1;">
              <div style="font-weight:700;">${escapeHtml(u.full_name)}</div>
              <div class="muted mono" style="font-size:12px;">${escapeHtml(u.player_uid)} · #${u.short_id}</div>
            </div>
          </div>
          <div class="field"><label>Full name</label><input id="pfName" value="${escapeHtml(u.full_name)}"></div>
          <div class="field"><label>Country</label><input id="pfCountry" value="${escapeHtml(u.country||'')}"></div>
          <div class="field"><label>Bio</label><textarea id="pfBio" rows="3">${escapeHtml(u.bio||'')}</textarea></div>
          <div class="field"><label>Avatar</label>
            <div class="flex gap-8" style="flex-wrap:wrap;">
              ${AVATARS.map(a=>`<div class="chip ${u.avatar_id===a?'active':''}" data-av="${a}" onclick="selectAvatar('${a}')">${a.replace('avatar_','#')}</div>`).join('')}
            </div>
          </div>
          <button class="btn btn-primary btn-block mt-10" onclick="saveProfile()">Save changes</button>
        </div>
        <div>
          <div class="glass card mb-18">
            <h3 class="mb-14" style="font-size:15px;">Account</h3>
            <div class="muted" style="font-size:13px;">Email: <span style="color:var(--text-hi);">${escapeHtml(u.email)}</span></div>
            <div class="muted mt-6" style="font-size:13px;">Phone: <span style="color:var(--text-hi);">${escapeHtml(u.phone_number)}</span></div>
            <div class="muted mt-6" style="font-size:13px;">Verified: <span style="color:var(--text-hi);">${u.is_email_verified?'✓ Yes':'✗ No'}</span></div>
            <div class="muted mt-6" style="font-size:13px;">Joined: <span style="color:var(--text-hi);">${fmtDateShort(u.created_at)}</span></div>
          </div>
          <div class="glass card">
            <div class="section-title"><h3 style="font-size:15px;">Game profiles</h3><button class="btn btn-sm btn-primary" onclick="openAddGameProfile()">+ Add</button></div>
            ${state.gameProfiles.length? state.gameProfiles.map(gp=>`
              <div class="list-row"><div class="row-icon">🎮</div><div style="flex:1;"><div style="font-weight:700;font-size:13px;">${escapeHtml(gameName(gp.game_id))}</div><div class="muted" style="font-size:11.5px;">${escapeHtml(JSON.stringify(gp.data||{}).slice(0,60))}</div></div></div>
            `).join('') : `<div class="empty-state"><div class="ic">🎮</div>No game profiles yet</div>`}
          </div>
        </div>
      </div>`;
  }catch(e){ el.innerHTML = `<div class="empty-state">⚠ ${escapeHtml(e.message)}</div>`; }
};
let pendingAvatar = null;
function selectAvatar(a){ pendingAvatar=a; document.querySelectorAll('.chip[data-av]').forEach(c=>c.classList.toggle('active', c.dataset.av===a)); }
async function saveProfile(){
  const body = { full_name: document.getElementById('pfName').value.trim(), country: document.getElementById('pfCountry').value.trim(), bio: document.getElementById('pfBio').value.trim() };
  if(pendingAvatar) body.avatar_id = pendingAvatar;
  try{ const u = await api('/users/me', {method:'PATCH', body}); state.user = u; localStorage.setItem(LS.user, JSON.stringify(u)); updateChip(); toast('Profile updated'); }
  catch(e){ toast(e.message,'err'); }
}
async function openAddGameProfile(){
  await ensureGames();
  openModal(`
    <div class="modal-head"><h3>Add game profile</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Game</label><select id="gpGame">${state.games.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('')}</select></div>
    <div class="field"><label>In-game name</label><input id="gpIgn" placeholder="Your in-game name"></div>
    <div class="field"><label>Player / UID</label><input id="gpUid" placeholder="Your game UID"></div>
    <button class="btn btn-primary btn-block" onclick="submitGameProfile()">Save profile</button>
  `);
}
async function submitGameProfile(){
  const gameId = document.getElementById('gpGame').value;
  const ign = document.getElementById('gpIgn').value.trim();
  const uid = document.getElementById('gpUid').value.trim();
  try{
    await api('/games/profiles', {method:'POST', body:{game_id: gameId, data:{ign, uid}}});
    toast('Game profile added'); closeModal(); goPage('profile');
  }catch(e){ toast(e.message,'err'); }
}
